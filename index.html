<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Inventory & Shopping List</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root {
  --bg-color: #f6f6f4;
  --card-bg: #ffffff;
  --card-border: #e3e3e0;
  --text-main: #171717;
  --text-muted: #858585;
  --input-bg: #f1f1ef;
  --black: #111111;
  --white: #ffffff;
  --soft-gray: #ededeb;
  --soft-gray-2: #f7f7f5;
  --danger: #222222;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--bg-color);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-main);
  touch-action: pan-y;
}
body {
  max-width: 540px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}

button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-container {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
}

.view {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 100vh;
  padding: 22px 16px 28px;
  background: var(--bg-color);
  will-change: transform, opacity;
}

#mainView { transform: translateX(0); z-index: 1; }
#detailView {
  transform: translateX(100%);
  z-index: 2;
  box-shadow: -8px 0 28px rgba(0,0,0,0.04);
  transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .35s ease;
}
#detailView.active { transform: translateX(0); opacity: 1; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

h1 {
  font-size: 22px;
  line-height: 1.1;
  font-weight: 800;
  margin: 0;
  color: var(--text-main);
  letter-spacing: -0.7px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  background: transparent;
  border: none;
  color: var(--text-main);
  cursor: pointer;
  padding: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.settings-dot {
  width: 18px;
  height: 18px;
  display: inline-block;
  border-radius: 50%;
  background: #555555;
  transition: opacity .15s;
}
.icon-btn:hover .settings-dot { opacity: 0.8; }

.category-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.category-card {
  min-height: 64px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 11px;
  padding: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: none;
  transition: transform .1s, background .15s, border-color .15s;
  user-select: none;
}
.category-card:active { transform: scale(.985); }
.category-card .category-name {
  display: block;
  width: 100%;
  text-align: center;
  font-size: 15px;
  line-height: 1;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: .7px;
  text-transform: uppercase;
}
.category-card.shopping-card {
  min-height: 76px;
  background: #111111;
  border-color: #111111;
}
.category-card.shopping-card .category-name {
  color: #FFFFFF !important;
}

.sub-header {
  display: grid;
  grid-template-columns: 52px 1fr 52px;
  align-items: center;
  min-height: 34px;
  margin-bottom: 16px;
}
.sub-header h1 {
  text-align: center;
  font-size: 18px;
  letter-spacing: -.35px;
}
.back-btn {
  background: transparent;
  border: none;
  font-size: 14px;
  font-weight: 650;
  color: var(--text-main);
  cursor: pointer;
  padding: 4px 0;
  text-align: left;
}

.action-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.search-input {
  min-width: 0;
  flex: 1;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--card-border);
  border-radius: 9px;
  background: var(--white);
  color: var(--text-main);
  font-size: 13px;
  outline: none;
}
.search-input:focus { border-color: #bcbcb8; }
.search-input::placeholder { color: #a1a19d; }

.btn-add-item {
  height: 40px;
  background: var(--black);
  color: var(--white);
  border: 1px solid var(--black);
  border-radius: 9px;
  padding: 0 13px;
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
}
.btn-add-item:active { opacity: .82; }

.inventory-table-container {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 11px;
  overflow: hidden;
  box-shadow: none;
}
.inventory-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  text-align: left;
  font-size: 12px;
}
.inventory-table th {
  background: var(--soft-gray-2);
  color: #777773;
  padding: 9px 7px;
  font-size: 9px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .65px;
  border-bottom: 1px solid var(--card-border);
}
.inventory-table td {
  height: 60px;
  padding: 8px 7px;
  border-bottom: 1px solid var(--card-border);
  vertical-align: middle;
  overflow: hidden;
}
.inventory-table tr { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.inventory-table tr:last-child td { border-bottom: none; }
.inventory-table tbody tr { transition: background .12s; }
.inventory-table tbody tr:active { background: #fafaf8; }

.item-name-cell {
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.25;
  word-break: keep-all;
}
.item-capacity-text {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.qty-container {
  width: 66px;
  height: 34px;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 3px;
  background: var(--input-bg);
  padding: 3px 4px 3px 6px;
  border-radius: 8px;
  vertical-align: middle;
}
.qty-count {
  font-size: 12px;
  font-weight: 750;
  min-width: 16px;
  text-align: center;
}
.qty-arrows { display: flex; flex-direction: column; }
.qty-arrow-btn {
  background: none;
  border: none;
  font-size: 7px;
  padding: 0 1px;
  cursor: pointer;
  color: #8a8a86;
  line-height: 1;
}
.qty-arrow-btn:hover { color: var(--text-main); }

.actions-cell {
  padding-left: 3px !important;
  padding-right: 3px !important;
}
.actions-cell > .actions-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.btn-icon-square {
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  background: var(--white);
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .12s, opacity .12s, transform .12s;
  padding: 0;
  margin: 0;
  font-size: 17px;
  line-height: 1;
  font-weight: 650;
}
.btn-icon-square:active { opacity: .7; transform: scale(.96); }
.btn-icon-edit { background: var(--soft-gray-2); color: var(--text-main); }
.btn-icon-delete { background: var(--white); color: #555; }
.btn-icon-move { background: var(--black); border-color: var(--black); color: var(--white); }
.btn-icon-square svg { width: 15px; height: 15px; fill: currentColor; }

.category-select-inline {
  width: 66px !important;
  height: 34px !important;
  margin: 6px auto 0 !important;
  display: block;
  box-sizing: border-box;
  padding: 0 4px;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--white);
  color: var(--text-main);
  font-size: 11px;
  line-height: 34px;
}
.color-cell {
  text-align: center !important;
  vertical-align: middle !important;
}
.qty-cat-cell {
  text-align: center !important;
  vertical-align: middle !important;
}

.shopping-row td { background: #fff; }
.shopping-row .item-name-cell { font-weight: 750; }
.shopping-row .btn-icon-move { width: 36px; height: 36px; border-radius: 8px; }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,.55);
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 18px;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--white);
  padding: 20px;
  border: 1px solid #e1e1de;
  border-radius: 14px;
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  box-shadow: 0 18px 50px rgba(0,0,0,.12);
}
.modal-content h3 { margin: 0 0 14px; font-size: 17px; text-align: center; letter-spacing: -.2px; }
.modal-content input, .modal-content select {
  width: 100%;
  height: 40px;
  padding: 0 10px;
  margin-bottom: 9px;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--white);
  color: var(--text-main);
  box-sizing: border-box;
  font-size: 13px;
  outline: none;
}
.modal-content input:focus, .modal-content select:focus { border-color: #bcbcb8; }
.modal-btns { display: flex; gap: 8px; margin-top: 10px; }
.modal-btns button {
  flex: 1;
  height: 40px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  cursor: pointer;
  font-weight: 650;
  font-size: 13px;
}
.btn-add-choice {
  background: var(--soft-gray-2);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 14px;
  width: 100%;
  margin-bottom: 9px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text-main);
}
.btn-add-choice:hover { background: var(--soft-gray); }
.btn-save { background: var(--black); color: var(--white); border-color: var(--black) !important; }
.btn-cancel { background: var(--soft-gray); color: var(--text-main); }

.scanner-container {
  position: relative;
  width: 100%;
  height: 260px;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}
#webcamVideo { width: 100%; height: 100%; object-fit: cover; }
.scan-guide {
  position: absolute;
  width: 75%;
  height: 60%;
  border: 2px dashed #fff;
  border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.4);
  pointer-events: none;
}
.loading-text {
  display: none;
  text-align: center;
  color: var(--text-main);
  font-size: 13px;
  margin: 10px 0;
  font-weight: 700;
}

html, body { overscroll-behavior-x: none; }
.color-input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.color-input-row input[type="color"] { width: 44px; height: 40px; padding: 2px; margin: 0; cursor: pointer; }
.color-hex-input { flex: 1; margin: 0 !important; }

@media (max-width: 390px) {
  .view { padding-left: 12px; padding-right: 12px; }
  .inventory-table { font-size: 11px; }
  .inventory-table th { padding-left: 5px; padding-right: 5px; }
  .inventory-table td { padding-left: 5px; padding-right: 5px; }
  .btn-icon-square { width: 29px; height: 29px; }
  .category-select-inline { max-width: 66px; }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- 메인 화면 -->
  <div id="mainView" class="view">
    <header>
      <h1>Studio Inventory</h1>
      <button class="icon-btn" onclick="openSettings()"><span class="settings-dot" aria-label="Settings"></span></button>
    </header>
    <div class="category-grid">
      <div class="category-card" onclick="openCategory('ACRYLIC')">
        <span class="category-name">ACRYLIC</span>
      </div>
      <div class="category-card" onclick="openCategory('OIL')">
        <span class="category-name">OIL</span>
      </div>
      <div class="category-card" onclick="openCategory('DRAWING')">
        <span class="category-name">DRAWING</span>
      </div>
      <div class="category-card" onclick="openCategory('MEDIUMS')">
        <span class="category-name">MEDIUMS</span>
      </div>
      <div class="category-card" onclick="openCategory('OTHERS')">
        <span class="category-name">OTHERS</span>
      </div>
      <div class="category-card shopping-card" onclick="openCategory('SHOPPING_LIST')">
        <span class="category-name">SHOPPING LIST</span>
      </div>
    </div>
  </div>

  <!-- 상세 화면 -->
  <div id="detailView" class="view">
    <div class="sub-header">
      <button class="back-btn" onclick="showMainView()">‹ Back</button>
      <h1 id="categoryTitle">ACRYLIC</h1>
      <div></div>
    </div>
    <div class="action-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search items..." oninput="renderCategoryItems()">
      <button class="btn-add-item" onclick="openAddChoiceModal()">+ Add Item</button>
    </div>
    <div class="inventory-table-container">
      <table class="inventory-table">
        <thead>
          <tr>
            <th style="width: 29%;">ITEM</th>
            <th style="width: 18%;">BRAND</th>
            <th style="width: 14%; text-align: center;">COLOR</th>
            <th style="width: 20%; text-align: center;">QTY / CAT</th>
            <th style="width: 19%; text-align: center;">ACTION</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 모달 팝업들 -->
<div id="addChoiceModal" class="modal">
  <div class="modal-content">
    <h3>+ 항목 추가 방식</h3>
    <button class="btn-add-choice" onclick="startLiveScanner()">Camera</button>
    <button class="btn-add-choice" onclick="openManualAddModal()">Manual</button>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('addChoiceModal')">취소</button>
    </div>
  </div>
</div>

<div id="scannerModal" class="modal">
  <div class="modal-content">
    <h3>📷 라이브 카메라 스캔</h3>
    <div class="scanner-container">
      <video id="webcamVideo" autoplay playsinline muted></video>
      <div class="scan-guide"></div>
    </div>
    <canvas id="captureCanvas" style="display:none;"></canvas>
    <div id="scanLoadingText" class="loading-text">AI가 라벨을 분석 중입니다...</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="stopLiveScanner()">취소</button>
      <button class="btn-save" onclick="captureAndAnalyze()">스캔하기</button>
    </div>
  </div>
</div>

<div id="confirmCategoryModal" class="modal">
  <div class="modal-content">
    <h3>카테고리 지정 필요</h3>
    <p style="font-size: 13px; color: var(--text-muted); text-align: center;">AI가 카테고리를 확정하지 못했습니다. 분류를 선택해 주세요.</p>
    <input type="hidden" id="pendingItemData">
    <select id="manualCategorySelect">
      <option value="ACRYLIC">ACRYLIC (아크릴)</option>
      <option value="OIL">OIL (오일)</option>
      <option value="DRAWING">DRAWING (드로잉재료)</option>
      <option value="MEDIUMS">MEDIUMS (미디엄)</option>
      <option value="OTHERS" selected>OTHERS (기타)</option>
    </select>
    <div class="modal-btns">
      <button class="btn-save" onclick="confirmPendingCategory()">저장하기</button>
    </div>
  </div>
</div>

<div id="moveCategoryModal" class="modal">
  <div class="modal-content">
    <h3>카테고리 이동</h3>
    <p id="moveItemTargetName" style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: -5px; margin-bottom: 15px;"></p>
    <input type="hidden" id="moveTargetItemId">
    <select id="targetCategorySelect">
      <option value="ACRYLIC">ACRYLIC (아크릴)</option>
      <option value="OIL">OIL (오일)</option>
      <option value="DRAWING">DRAWING (드로잉)</option>
      <option value="MEDIUMS">MEDIUMS (미디엄)</option>
      <option value="OTHERS">OTHERS (기타)</option>
      <option value="SHOPPING_LIST">SHOPPING LIST (쇼핑리스트)</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('moveCategoryModal')">취소</button>
      <button class="btn-save" onclick="executeCategoryMove()">이동하기</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h3>⚙️ API 키 설정</h3>
    <input type="password" id="apiKeyInput" placeholder="Google Gemini API Key">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('settingsModal')">취소</button>
      <button class="btn-save" onclick="saveApiKey()">저장</button>
    </div>
  </div>
</div>

<div id="itemModal" class="modal">
  <div class="modal-content">
    <h3 id="itemModalTitle">재료 등록</h3>
    <input type="hidden" id="editItemId">
    <div id="categorySelectGroup" style="display: none; margin-bottom: 10px;">
      <label style="font-size: 11px; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 4px;">카테고리 선택</label>
      <select id="inputCategory">
        <option value="ACRYLIC">ACRYLIC</option>
        <option value="OIL">OIL</option>
        <option value="DRAWING">DRAWING</option>
        <option value="MEDIUMS">MEDIUMS</option>
        <option value="OTHERS" selected>OTHERS</option>
      </select>
    </div>
    <input type="text" id="inputBrand" placeholder="브랜드 (예: 신한, 홀베인)">
    <input type="text" id="inputName" placeholder="재료/색상명 (예: 울트라마린 블루)">
    <input type="text" id="inputCapacity" placeholder="용량 (예: 50ml, 12색)">
    <div class="color-input-row">
      <input type="color" id="inputColorHex" value="#cbd5e1" title="색상 선택">
      <input type="text" id="inputColorText" class="color-hex-input" placeholder="색상 HEX (예: #1e40af)" maxlength="7">
    </div>
    <input type="number" id="inputQty" placeholder="수량" value="1" min="0">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('itemModal')">취소</button>
      <button class="btn-save" onclick="saveManualItem()">저장</button>
    </div>
  </div>
</div>

<script>
const GEMINI_MODEL = "gemini-3.6-flash";
let currentCategory = '';
let mediaStream = null;

function showMainView() {
  const detailView = document.getElementById('detailView');
  const mainView = document.getElementById('mainView');
  
  detailView.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease';
  detailView.style.transform = 'translateX(100%)';
  detailView.style.opacity = '1';
  mainView.style.transform = 'scale(1)';
  mainView.style.opacity = '1';
  
  detailView.classList.remove('active');
}

function openCategory(cat) {
  currentCategory = cat;
  document.getElementById('categoryTitle').innerText = (cat === 'SHOPPING_LIST') ? 'SHOPPING LIST' : cat;
  document.getElementById('searchInput').value = '';
  
  const detailView = document.getElementById('detailView');
  const mainView = document.getElementById('mainView');
  
  detailView.style.transition = 'none';
  detailView.style.transform = 'translateX(100%)';
  detailView.style.opacity = '1';
  
  mainView.style.transition = 'none';
  mainView.style.transform = 'scale(1)';
  mainView.style.opacity = '1';

  detailView.classList.add('active');
  renderCategoryItems();
  
  requestAnimationFrame(() => {
    detailView.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease';
    detailView.style.transform = 'translateX(0)';
    
    mainView.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease';
    mainView.style.transform = 'scale(0.92)';
    mainView.style.opacity = '0.6';
  });
}

function openAddChoiceModal() {
  document.getElementById('addChoiceModal').classList.add('active');
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('active');
}

function getStorageKey() {
  return (currentCategory === 'SHOPPING_LIST') ? 'art_shopping' : 'art_inventory';
}

function getItems(key = getStorageKey()) {
  return JSON.parse(localStorage.getItem(key) || '[]');
}

function saveItems(key, items) {
  localStorage.setItem(key, JSON.stringify(items));
}

function getColorCode(name) {
  if (!name) return '#cbd5e1';
  const lower = name.toLowerCase();
  if (lower.includes('white') || lower.includes('화이트') || lower.includes('백색')) return '#ffffff';
  if (lower.includes('black') || lower.includes('블랙') || lower.includes('검정')) return '#0f172a';
  if (lower.includes('ultramarine') || lower.includes('울트라마린')) return '#1e40af';
  if (lower.includes('cobalt blue') || lower.includes('코발트 블루')) return '#2563eb';
  if (lower.includes('cerulean') || lower.includes('세룰리안')) return '#0284c7';
  if (lower.includes('phthalo blue') || lower.includes('프탈로 블루')) return '#0369a1';
  if (lower.includes('blue') || lower.includes('블루') || lower.includes('청')) return '#3b82f6';
  if (lower.includes('cadmium red') || lower.includes('카드뮴 레드')) return '#dc2626';
  if (lower.includes('vermilion') || lower.includes('버밀리언') || lower.includes('주홍')) return '#ea580c';
  if (lower.includes('crimson') || lower.includes('크림슨') || lower.includes('alizarin')) return '#991b1b';
  if (lower.includes('magenta') || lower.includes('마젠타')) return '#db2777';
  if (lower.includes('pink') || lower.includes('핑크')) return '#f472b6';
  if (lower.includes('red') || lower.includes('레드') || lower.includes('빨강')) return '#ef4444';
  if (lower.includes('lemon') || lower.includes('레몬')) return '#fef08a';
  if (lower.includes('cadmium yellow') || lower.includes('카드뮴 옐로우')) return '#eab308';
  if (lower.includes('yellow') || lower.includes('옐로우') || lower.includes('노랑')) return '#facc15';
  if (lower.includes('ochre') || lower.includes('오커') || lower.includes('황토')) return '#ca8a04';
  if (lower.includes('orange') || lower.includes('오렌지') || lower.includes('주황')) return '#f97316';
  if (lower.includes('viridian') || lower.includes('비리디안')) return '#047857';
  if (lower.includes('sap green') || lower.includes('새프 그린')) return '#15803d';
  if (lower.includes('phthalo green') || lower.includes('프탈로 그린')) return '#065f46';
  if (lower.includes('green') || lower.includes('그린') || lower.includes('초록')) return '#22c55e';
  if (lower.includes('violet') || lower.includes('바이올렛') || lower.includes('purple') || lower.includes('퍼플') || lower.includes('보라')) return '#7c3aed';
  if (lower.includes('burnt sienna') || lower.includes('번트 시엔나')) return '#9a3412';
  if (lower.includes('raw umber') || lower.includes('로 엄버') || lower.includes('burnt umber') || lower.includes('번트 엄버')) return '#78350f';
  if (lower.includes('brown') || lower.includes('브라운') || lower.includes('갈색')) return '#a16207';
  if (lower.includes('grey') || lower.includes('gray') || lower.includes('그레이') || lower.includes('회색')) return '#64748b';
  return '#cbd5e1';
}

let longPressTimer = null;

function attachLongPressListener(trElement, itemId) {
  const startHandler = () => {
    longPressTimer = setTimeout(() => {
      if (navigator.vibrate) navigator.vibrate(40);
      openMoveCategoryModal(itemId);
    }, 500);
  };
  const cancelHandler = () => clearTimeout(longPressTimer);

  trElement.addEventListener('touchstart', startHandler, { passive: true });
  trElement.addEventListener('touchend', cancelHandler);
  trElement.addEventListener('touchmove', cancelHandler);
  trElement.addEventListener('mousedown', startHandler);
  trElement.addEventListener('mouseup', cancelHandler);
  trElement.addEventListener('mouseleave', cancelHandler);
}

function openMoveCategoryModal(itemId) {
  const key = getStorageKey();
  const items = getItems(key);
  const item = items.find(i => i.id == itemId);
  if (!item) return;

  document.getElementById('moveTargetItemId').value = itemId;
  document.getElementById('moveItemTargetName').innerText = `'${item.name}' 항목을 어디로 이동할까요?`;
  
  const select = document.getElementById('targetCategorySelect');
  select.value = (currentCategory === 'SHOPPING_LIST') ? 'SHOPPING_LIST' : (item.category || 'OTHERS');

  document.getElementById('moveCategoryModal').classList.add('active');
}

function executeCategoryMove() {
  const itemId = document.getElementById('moveTargetItemId').value;
  const newCategory = document.getElementById('targetCategorySelect').value;
  const currentKey = getStorageKey();
  let currentItems = getItems(currentKey);

  const itemIndex = currentItems.findIndex(i => i.id == itemId);
  if (itemIndex === -1) return;

  const [item] = currentItems.splice(itemIndex, 1);

  if (newCategory === 'SHOPPING_LIST') {
    saveItems(currentKey, currentItems);
    let shoppingItems = getItems('art_shopping');
    item.category = 'OTHERS';
    shoppingItems.push(item);
    saveItems('art_shopping', shoppingItems);
  } else if (currentCategory === 'SHOPPING_LIST') {
    saveItems('art_shopping', currentItems);
    let inventoryItems = getItems('art_inventory');
    item.category = newCategory;
    inventoryItems.push(item);
    saveItems('art_inventory', inventoryItems);
  } else {
    item.category = newCategory;
    currentItems.push(item);
    saveItems(currentKey, currentItems);
  }

  closeModal('moveCategoryModal');
  renderCategoryItems();
}

function changeItemCategory(id, newCat) {
  const key = getStorageKey();
  let items = getItems(key);
  items = items.map(i => {
    if (i.id == id) i.category = newCat;
    return i;
  });
  saveItems(key, items);
  renderCategoryItems();
}

function changeQty(id, delta) {
  const key = getStorageKey();
  let items = getItems(key);
  items = items.map(i => {
    if (i.id == id) i.qty = Math.max(0, i.qty + delta);
    return i;
  });
  saveItems(key, items);
  renderCategoryItems();
}

async function startLiveScanner() {
  const apiKey = localStorage.getItem('gemini_api_key');
  if (!apiKey) {
    alert('설정에서 Gemini API 키를 먼저 입력해주세요.');
    openSettings();
    return;
  }
  closeModal('addChoiceModal');
  document.getElementById('scannerModal').classList.add('active');
  document.getElementById('scanLoadingText').style.display = 'none';

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });
    const video = document.getElementById('webcamVideo');
    video.srcObject = mediaStream;
    video.play();
  } catch (err) {
    alert('카메라를 실행할 수 없습니다: ' + err.message);
    stopLiveScanner();
  }
}

function stopLiveScanner() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }
  const video = document.getElementById('webcamVideo');
  if (video) video.srcObject = null;
  closeModal('scannerModal');
}

async function captureAndAnalyze() {
  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('captureCanvas');
  const apiKey = localStorage.getItem('gemini_api_key');

  if (!video.videoWidth || !video.videoHeight) {
    alert('카메라 화면이 아직 준비되지 않았습니다.');
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const mimeType = 'image/jpeg';
  const base64Data = canvas.toDataURL(mimeType, 0.85).split(',')[1];

  document.getElementById('scanLoadingText').style.display = 'block';

  try {
    const aiResult = await analyzeImage(base64Data, mimeType, apiKey);
    if (aiResult) {
      let finalCategory = aiResult.category;
      
      if (!finalCategory || finalCategory === 'UNKNOWN' || !['ACRYLIC', 'OIL', 'DRAWING', 'MEDIUMS', 'OTHERS'].includes(finalCategory)) {
        stopLiveScanner();
        document.getElementById('pendingItemData').value = JSON.stringify(aiResult);
        document.getElementById('confirmCategoryModal').classList.add('active');
        return;
      }

      saveScannedItem(aiResult, finalCategory);
      stopLiveScanner();
      renderCategoryItems();
    }
  } catch (err) {
    alert('스캔 실패: ' + err.message);
  } finally {
    document.getElementById('scanLoadingText').style.display = 'none';
  }
}

function confirmPendingCategory() {
  const rawData = document.getElementById('pendingItemData').value;
  const selectedCat = document.getElementById('manualCategorySelect').value;
  if (rawData) {
    const itemData = JSON.parse(rawData);
    saveScannedItem(itemData, selectedCat);
    closeModal('confirmCategoryModal');
    renderCategoryItems();
  }
}

async function analyzeImage(base64Data, mimeType, apiKey) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  
  const promptText = `Analyze this art supply image and extract details in strictly valid JSON format.
  Categories allowed: ["ACRYLIC", "OIL", "DRAWING", "MEDIUMS", "OTHERS"]
  If you cannot determine the category with high confidence, set "category" as "UNKNOWN".
  
  JSON format:
  {
    "brand": "brand name or empty string",
    "name": "item or color name",
    "capacity": "capacity e.g. 50ml or empty string",
    "category": "one of the allowed categories or UNKNOWN"
  }`;

  const payload = {
    contents: [{
      parts: [
        { text: promptText },
        { inline_data: { mime_type: mimeType, data: base64Data } }
      ]
    }],
    generationConfig: {
      responseMimeType: "application/json"
    }
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData.error?.message || `통신 오류 (${res.status})`);
  }

  const data = await res.json();
  const responseText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

  if (!responseText) {
    throw new Error("이미지에서 정보 추출에 실패했습니다.");
  }

  try {
    const cleanJsonText = responseText.replace(/```json/g, "").replace(/```/g, "").trim();
    return JSON.parse(cleanJsonText);
  } catch (e) {
    throw new Error("AI 응답을 파싱할 수 없습니다.");
  }
}

function saveScannedItem(aiResult, category) {
  const key = (category === 'SHOPPING_LIST') ? 'art_shopping' : 'art_inventory';
  let items = getItems(key);

  const newItem = {
    id: Date.now(),
    brand: aiResult.brand || '',
    name: aiResult.name || 'Unknown Item',
    capacity: aiResult.capacity || '',
    colorHex: getColorCode(aiResult.name),
    qty: 1,
    category: (category === 'SHOPPING_LIST') ? 'OTHERS' : category
  };

  items.unshift(newItem);
  saveItems(key, items);
}

function openManualAddModal() {
  closeModal('addChoiceModal');
  document.getElementById('itemModalTitle').innerText = '재료 수동 등록';
  document.getElementById('editItemId').value = '';
  document.getElementById('inputBrand').value = '';
  document.getElementById('inputName').value = '';
  document.getElementById('inputCapacity').value = '';
  document.getElementById('inputColorHex').value = '#cbd5e1';
  document.getElementById('inputColorText').value = '';
  document.getElementById('inputQty').value = '1';

  if (currentCategory === 'SHOPPING_LIST') {
    document.getElementById('categorySelectGroup').style.display = 'block';
    document.getElementById('inputCategory').value = 'OTHERS';
  } else {
    document.getElementById('categorySelectGroup').style.display = 'none';
  }

  document.getElementById('itemModal').classList.add('active');
}

function openEditModal(id) {
  const key = getStorageKey();
  const items = getItems(key);
  const item = items.find(i => i.id == id);
  if (!item) return;

  document.getElementById('itemModalTitle').innerText = '재료 수정';
  document.getElementById('editItemId').value = item.id;
  document.getElementById('inputBrand').value = item.brand || '';
  document.getElementById('inputName').value = item.name || '';
  document.getElementById('inputCapacity').value = item.capacity || '';
  document.getElementById('inputColorHex').value = item.colorHex || '#cbd5e1';
  document.getElementById('inputColorText').value = item.colorHex || '';
  document.getElementById('inputQty').value = item.qty ?? 1;

  if (currentCategory === 'SHOPPING_LIST') {
    document.getElementById('categorySelectGroup').style.display = 'block';
    document.getElementById('inputCategory').value = item.category || 'OTHERS';
  } else {
    document.getElementById('categorySelectGroup').style.display = 'none';
  }

  document.getElementById('itemModal').classList.add('active');
}

function saveManualItem() {
  const editId = document.getElementById('editItemId').value;
  const brand = document.getElementById('inputBrand').value.trim();
  const name = document.getElementById('inputName').value.trim();
  const capacity = document.getElementById('inputCapacity').value.trim();
  let colorHex = document.getElementById('inputColorText').value.trim();
  if (!colorHex.startsWith('#')) {
    colorHex = document.getElementById('inputColorHex').value;
  }
  const qty = parseInt(document.getElementById('inputQty').value) || 0;

  if (!name) {
    alert('재료/색상명을 입력해주세요.');
    return;
  }

  const key = getStorageKey();
  let items = getItems(key);

  if (editId) {
    items = items.map(i => {
      if (i.id == editId) {
        i.brand = brand;
        i.name = name;
        i.capacity = capacity;
        i.colorHex = colorHex;
        i.qty = qty;
        if (currentCategory === 'SHOPPING_LIST') {
          i.category = document.getElementById('inputCategory').value;
        }
      }
      return i;
    });
  } else {
    const newItem = {
      id: Date.now(),
      brand,
      name,
      capacity,
      colorHex,
      qty,
      category: (currentCategory === 'SHOPPING_LIST') ? document.getElementById('inputCategory').value : currentCategory
    };
    items.unshift(newItem);
  }

  saveItems(key, items);
  closeModal('itemModal');
  renderCategoryItems();
}

function deleteItem(id) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  const key = getStorageKey();
  let items = getItems(key);
  items = items.filter(i => i.id != id);
  saveItems(key, items);
  renderCategoryItems();
}

function openSettings() {
  const apiKey = localStorage.getItem('gemini_api_key') || '';
  document.getElementById('apiKeyInput').value = apiKey;
  document.getElementById('settingsModal').classList.add('active');
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    alert('API 키를 입력해주세요.');
    return;
  }
  localStorage.setItem('gemini_api_key', key);
  closeModal('settingsModal');
  alert('API 키가 저장되었습니다.');
}

function renderCategoryItems() {
  const tbody = document.getElementById('inventoryTableBody');
  const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
  tbody.innerHTML = '';

  let items = getItems();

  if (currentCategory !== 'SHOPPING_LIST') {
    items = items.filter(i => (i.category || 'OTHERS') === currentCategory);
  }

  if (searchKeyword) {
    items = items.filter(i => 
      (i.name && i.name.toLowerCase().includes(searchKeyword)) ||
      (i.brand && i.brand.toLowerCase().includes(searchKeyword)) ||
      (i.capacity && i.capacity.toLowerCase().includes(searchKeyword))
    );
  }

  if (items.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); height: 80px;">등록된 항목이 없습니다.</td></tr>`;
    return;
  }

  items.forEach(item => {
    const tr = document.createElement('tr');
    if (currentCategory === 'SHOPPING_LIST') {
      tr.className = 'shopping-row';
    }

    attachLongPressListener(tr, item.id);

    const colorVal = item.colorHex || getColorCode(item.name);

    let catCellContent = '';
    if (currentCategory === 'SHOPPING_LIST') {
      catCellContent = `
        <select class="category-select-inline" onchange="changeItemCategory(${item.id}, this.value)">
          <option value="ACRYLIC" ${item.category === 'ACRYLIC' ? 'selected' : ''}>ACRYLIC</option>
          <option value="OIL" ${item.category === 'OIL' ? 'selected' : ''}>OIL</option>
          <option value="DRAWING" ${item.category === 'DRAWING' ? 'selected' : ''}>DRAWING</option>
          <option value="MEDIUMS" ${item.category === 'MEDIUMS' ? 'selected' : ''}>MEDIUMS</option>
          <option value="OTHERS" ${!item.category || item.category === 'OTHERS' ? 'selected' : ''}>OTHERS</option>
        </select>
      `;
    } else {
      catCellContent = `
        <div class="qty-container">
          <span class="qty-count">${item.qty ?? 1}</span>
          <div class="qty-arrows">
            <button class="qty-arrow-btn" onclick="changeQty(${item.id}, 1)">▲</button>
            <button class="qty-arrow-btn" onclick="changeQty(${item.id}, -1)">▼</button>
          </div>
        </div>
      `;
    }

    tr.innerHTML = `
      <td class="item-name-cell">
        <div>${item.name}</div>
        <div class="item-capacity-text">${item.capacity || ''}</div>
      </td>
      <td style="font-size: 11px; color: var(--text-muted); font-weight: 600;">${item.brand || '-'}</td>
      <td class="color-cell">
        <span class="color-thumbnail-circle" style="background: ${colorVal};"></span>
      </td>
      <td class="qty-cat-cell">
        ${catCellContent}
      </td>
      <td class="actions-cell">
        <div style="display: flex; align-items: center; justify-content: center; gap: 4px;">
          <button class="btn-icon-square btn-icon-edit" onclick="openEditModal(${item.id})" title="수정">✎</button>
          <button class="btn-icon-square btn-icon-delete" onclick="deleteItem(${item.id})" title="삭제">×</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('inputColorHex').addEventListener('input', (e) => {
  document.getElementById('inputColorText').value = e.target.value;
});
