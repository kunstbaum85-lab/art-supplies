<script>
    let currentCategory = '';

    // =========================================================
    // 기본 UI 로직
    // =========================================================

    function showMainView() {
        document.getElementById('detailView').classList.remove('active');
        document.getElementById('mainView').classList.add('active');
    }

    function openCategory(cat) {
        currentCategory = cat;

        document.getElementById('categoryTitle').innerText = cat;
        document.getElementById('searchInput').value = '';

        document.getElementById('mainView').classList.remove('active');
        document.getElementById('detailView').classList.add('active');

        renderCategoryItems();
    }

    function openAddChoiceModal() {
        document.getElementById('addChoiceModal').classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function selectAddOption(option) {
        closeModal('addChoiceModal');

        if (option === 'photo') {
            triggerCamera();
        } else {
            openManualAddModal();
        }
    }


    // =========================================================
    // 데이터 관리
    // =========================================================

    function getItems() {
        try {
            return JSON.parse(
                localStorage.getItem('art_inventory') || '[]'
            );
        } catch (error) {
            console.error('재료 데이터 읽기 실패:', error);
            return [];
        }
    }

    function saveItems(items) {
        localStorage.setItem(
            'art_inventory',
            JSON.stringify(items)
        );
    }


    // =========================================================
    // Gemini 설정
    // =========================================================

    const GEMINI_MODEL = 'gemini-2.5-flash';


    // =========================================================
    // 카메라 실행
    // =========================================================

    function triggerCamera() {

        const key = localStorage.getItem('gemini_api_key');

        if (!key) {
            alert('Gemini API 키를 먼저 설정하세요.');
            openSettings();
            return;
        }

        const cameraInput = document.getElementById('cameraInput');

        if (!cameraInput) {
            alert('카메라 입력 요소를 찾을 수 없습니다.');
            console.error('#cameraInput 요소가 없습니다.');
            return;
        }

        cameraInput.click();
    }


    // =========================================================
    // 카메라 이미지 처리
    // =========================================================

    document.getElementById('cameraInput').addEventListener(
        'change',
        async function (e) {

            const file = e.target.files && e.target.files[0];

            if (!file) {
                return;
            }

            const loadingText = document.getElementById('loadingText');

            try {

                if (loadingText) {
                    loadingText.style.display = 'block';
                    loadingText.innerText =
                        '사진을 분석하고 있습니다...';
                }

                const apiKey =
                    localStorage.getItem('gemini_api_key');

                if (!apiKey) {
                    throw new Error(
                        'Gemini API 키가 없습니다.'
                    );
                }


                // -------------------------------------------------
                // 이미지 변환
                // -------------------------------------------------

                const imageData =
                    await convertBase64(file);


                // -------------------------------------------------
                // Gemini 분석
                // -------------------------------------------------

                if (loadingText) {
                    loadingText.innerText =
                        '제품명과 용량을 읽고 있습니다...';
                }

                const aiResult =
                    await analyzeImage(
                        imageData.base64,
                        imageData.mimeType,
                        apiKey
                    );


                // -------------------------------------------------
                // 결과 검증
                // -------------------------------------------------

                if (
                    !aiResult ||
                    typeof aiResult !== 'object'
                ) {
                    throw new Error(
                        'AI가 올바른 제품 정보를 반환하지 않았습니다.'
                    );
                }


                // -------------------------------------------------
                // 재료 저장
                // -------------------------------------------------

                const items = getItems();

                const newItem = {

                    id: Date.now(),

                    category:
                        currentCategory || '기타',

                    brand:
                        cleanAIValue(aiResult.brand) ||
                        '기타',

                    name:
                        cleanAIValue(aiResult.name) ||
                        '알 수 없는 재료',

                    capacity:
                        cleanAIValue(aiResult.capacity) ||
                        '',

                    qty: 1
                };

                items.push(newItem);

                saveItems(items);


                // -------------------------------------------------
                // 화면 갱신
                // -------------------------------------------------

                renderCategoryItems();

                alert(
                    `등록되었습니다.\n\n` +
                    `${newItem.brand} ${newItem.name}` +
                    (
                        newItem.capacity
                            ? `\n${newItem.capacity}`
                            : ''
                    )
                );

            } catch (error) {

                console.error(
                    '카메라 스캔 오류:',
                    error
                );

                let message =
                    error.message ||
                    '알 수 없는 오류';


                if (
                    message.includes('API_KEY')
                ) {

                    message =
                        'Gemini API 키를 확인해주세요.';

                } else if (
                    message.includes('400') ||
                    message.includes('INVALID_ARGUMENT')
                ) {

                    message =
                        '사진 형식 또는 요청 내용에 문제가 있습니다.';

                } else if (
                    message.includes('401') ||
                    message.includes('403')
                ) {

                    message =
                        'Gemini API 키가 유효하지 않거나 API 사용 권한이 없습니다.';

                } else if (
                    message.includes('404') ||
                    message.includes('NOT_FOUND')
                ) {

                    message =
                        '현재 Gemini 모델을 사용할 수 없습니다. 모델 설정을 확인해주세요.';

                } else if (
                    message.includes('429') ||
                    message.includes('RESOURCE_EXHAUSTED')
                ) {

                    message =
                        'Gemini API 사용량 제한에 도달했습니다. 잠시 후 다시 시도해주세요.';

                } else if (
                    message.includes('500') ||
                    message.includes('503')
                ) {

                    message =
                        'Gemini 서버가 일시적으로 응답하지 않습니다. 잠시 후 다시 시도해주세요.';
                }

                alert(
                    '스캔 실패\n\n' +
                    message
                );

            } finally {

                if (loadingText) {
                    loadingText.style.display = 'none';
                }

                e.target.value = '';
            }
        }
    );


    // =========================================================
    // 이미지 → Base64
    // =========================================================

    function convertBase64(file) {

        return new Promise((resolve, reject) => {

            if (!file) {
                reject(
                    new Error(
                        '이미지 파일이 없습니다.'
                    )
                );
                return;
            }

            if (
                !file.type ||
                !file.type.startsWith('image/')
            ) {

                reject(
                    new Error(
                        '이미지 파일만 사용할 수 있습니다.'
                    )
                );

                return;
            }

            const reader = new FileReader();

            reader.onload = () => {

                try {

                    const result =
                        reader.result;

                    if (
                        typeof result !== 'string' ||
                        !result.includes(',')
                    ) {

                        reject(
                            new Error(
                                '이미지 데이터를 읽을 수 없습니다.'
                            )
                        );

                        return;
                    }

                    const base64 =
                        result.split(',')[1];

                    resolve({

                        base64: base64,

                        mimeType: file.type
                    });

                } catch (error) {

                    reject(error);
                }
            };

            reader.onerror = () => {

                reject(
                    new Error(
                        '사진 파일을 읽는 중 오류가 발생했습니다.'
                    )
                );
            };

            reader.readAsDataURL(file);
        });
    }


    // =========================================================
    // Gemini 이미지 분석
    // =========================================================

    async function analyzeImage(
        base64Data,
        mimeType,
        apiKey
    ) {

        if (!base64Data) {
            throw new Error(
                '이미지 데이터가 없습니다.'
            );
        }

        if (!mimeType) {
            throw new Error(
                '이미지 형식을 확인할 수 없습니다.'
            );
        }

        if (!apiKey) {
            throw new Error(
                'API_KEY가 없습니다.'
            );
        }


        const url =
            `https://generativelanguage.googleapis.com/v1beta/models/` +
            `${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;


        // ---------------------------------------------------------
        // 미술재료 라벨 인식용 프롬프트
        // ---------------------------------------------------------

        const prompt = `
You are identifying an art material from a product photograph.

Read the visible product label carefully.

Extract ONLY these three fields:

1. brand
2. name
3. capacity

Important rules:

- Read the actual text visible on the package.
- Do NOT invent information.
- Do NOT guess a brand if it cannot be seen.
- If a value cannot be determined, return an empty string.
- Preserve the original product name as accurately as possible.
- Preserve numbers and units in the capacity.
- Examples of capacity: "75 ml", "250 ml", "500 g", "1 L".
- If the image contains multiple products, identify the main or most prominent product.
- Do not include color names unless they are clearly part of the product name.
- Do not provide explanations.
- Return only the requested JSON object.

The JSON fields must be exactly:

{
  "brand": "",
  "name": "",
  "capacity": ""
}
`;


        const requestBody = {

            contents: [

                {

                    role: 'user',

                    parts: [

                        {
                            text: prompt
                        },

                        {
                            inline_data: {

                                mime_type: mimeType,

                                data: base64Data
                            }
                        }

                    ]
                }
            ],

            generationConfig: {

                responseMimeType:
                    'application/json',

                responseSchema: {

                    type: 'OBJECT',

                    properties: {

                        brand: {
                            type: 'STRING'
                        },

                        name: {
                            type: 'STRING'
                        },

                        capacity: {
                            type: 'STRING'
                        }
                    },

                    required: [
                        'brand',
                        'name',
                        'capacity'
                    ]
                },

                maxOutputTokens: 200,

                temperature: 0
            }
        };


        // ---------------------------------------------------------
        // API 요청
        // ---------------------------------------------------------

        let response;

        try {

            response = await fetch(

                url,

                {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )
                }

            );

        } catch (networkError) {

            throw new Error(
                '인터넷 연결 또는 Gemini 서버 연결에 실패했습니다.'
            );
        }


        // ---------------------------------------------------------
        // HTTP 응답 JSON 처리
        // ---------------------------------------------------------

        let data;

        try {

            data =
                await response.json();

        } catch (jsonError) {

            throw new Error(
                `Gemini 서버가 올바른 응답을 보내지 않았습니다. ` +
                `(HTTP ${response.status})`
            );
        }


        // ---------------------------------------------------------
        // API 오류
        // ---------------------------------------------------------

        if (!response.ok) {

            console.error(
                'Gemini API 오류:',
                data
            );

            const apiMessage =
                data?.error?.message ||
                `HTTP ${response.status}`;

            throw new Error(
                apiMessage
            );
        }


        // ---------------------------------------------------------
        // candidates 검증
        // ---------------------------------------------------------

        if (
            !data.candidates ||
            !Array.isArray(data.candidates) ||
            data.candidates.length === 0
        ) {

            console.error(
                'Gemini 응답에 candidates가 없습니다:',
                data
            );

            throw new Error(
                'AI가 분석 결과를 반환하지 않았습니다.'
            );
        }


        const candidate =
            data.candidates[0];


        // ---------------------------------------------------------
        // content / parts 검증
        // ---------------------------------------------------------

        if (
            !candidate.content ||
            !candidate.content.parts ||
            !Array.isArray(
                candidate.content.parts
            )
        ) {

            console.error(
                '잘못된 Gemini 응답 구조:',
                data
            );

            throw new Error(
                'AI 응답 형식을 읽을 수 없습니다.'
            );
        }


        // ---------------------------------------------------------
        // text 찾기
        // ---------------------------------------------------------

        const textPart =
            candidate.content.parts.find(
                part =>
                    typeof part.text === 'string' &&
                    part.text.trim().length > 0
            );


        if (!textPart) {

            console.error(
                '텍스트가 없는 Gemini 응답:',
                data
            );

            throw new Error(
                'AI가 제품 정보를 읽지 못했습니다.'
            );
        }


        let text =
            textPart.text.trim();


        // ---------------------------------------------------------
        // Markdown JSON 대비
        // ---------------------------------------------------------

        text =
            text
                .replace(
                    /^```json\s*/i,
                    ''
                )
                .replace(
                    /^```\s*/i,
                    ''
                )
                .replace(
                    /\s*```$/i,
                    ''
                )
                .trim();


        // ---------------------------------------------------------
        // JSON 파싱
        // ---------------------------------------------------------

        let result;

        try {

            result =
                JSON.parse(text);

        } catch (parseError) {

            console.error(
                'JSON 파싱 실패:',
                text
            );

            throw new Error(
                'AI가 제품 정보를 올바른 형식으로 반환하지 않았습니다.'
            );
        }


        // ---------------------------------------------------------
        // 최종 결과
        // ---------------------------------------------------------

        return {

            brand:
                typeof result.brand === 'string'
                    ? result.brand.trim()
                    : '',

            name:
                typeof result.name === 'string'
                    ? result.name.trim()
                    : '',

            capacity:
                typeof result.capacity === 'string'
                    ? result.capacity.trim()
                    : ''
        };
    }


    // =========================================================
    // AI 결과 문자열 정리
    // =========================================================

    function cleanAIValue(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return '';
        }

        return String(value)
            .replace(/\s+/g, ' ')
            .trim();
    }


    // =========================================================
    // 기존 앱 함수
    // =========================================================

    // 아래 함수들은 기존 코드 그대로 유지:
    //

    // openManualAddModal()
    // openSettings()
    //
    // 기타 기존 UI 함수들


</script>
