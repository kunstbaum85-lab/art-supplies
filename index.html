<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- iOS 핀치 줌/확대 차단 및 노치(Safe Area) 영역 확장 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Studio Inventory & Shopping List</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root {
  --bg-color: #f6f6f4;
  --card-bg: #ffffff;
  --card-border: #e3e3e0;
  --text-main: #171717;
  --text-muted: #858585;
  --input-bg: #f1f1ef;
  --black: #111111;
  --white: #ffffff;
  --soft-gray: #ededeb;
  --soft-gray-2: #f7f7f5;
  --danger: #222222;
}

* { 
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* 화면 크기 고정 및 사파리 바운스 스크롤/확대 원천 차단 */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: fixed;
  background: var(--bg-color);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-main);
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

button, input, select { 
  font: inherit; 
  user-select: auto;
  -webkit-user-select: auto;
}

.app-container {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 540px;
  margin: 0 auto;
  overflow: hidden;
}

/* 뷰 내부에서만 부드러운 스크롤 허용 및 Safe Area 여백 적용 */
.view {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
  background: var(--bg-color);
  will-change: transform, opacity;
  box-sizing: border-box;
}

#mainView { transform: translateX(0); z-index: 1; }
#detailView {
  transform: translateX(100%);
  z-index: 2;
  box-shadow: -8px 0 28px rgba(0,0,0,0.04);
  transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .35s ease;
}
#detailView.active { transform: translateX(0); opacity: 1; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

h1 {
  font-size: 22px;
  line-height: 1.1;
  font-weight: 800;
  margin: 0;
  color: var(--text-main);
  letter-spacing: -0.7px;
}

.icon-btn {
  width: 28px;
  height: 28px;
  background: var(--black);
  border: none;
  color: var(--white);
  cursor: pointer;
  padding: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .15s;
}
.icon-btn:hover { opacity: .8; }
.icon-btn svg { width: 14px; height: 14px; fill: currentColor; }

.category-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.category-card {
  min-height: 64px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 11px;
  padding: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: none;
  transition: transform .1s, background .15s, border-color .15s;
  user-select: none;
}
.category-card:active { transform: scale(.985); }
.category-card .category-name {
  display: block;
  width: 100%;
  text-align: center;
  font-size: 15px;
  line-height: 1;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: .7px;
  text-transform: uppercase;
}
.category-card.shopping-card {
  min-height: 76px;
  background: #111111;
  border-color: #111111;
}
.category-card.shopping-card .category-name {
  color: #ffffff;
}

.sub-header {
  display: grid;
  grid-template-columns: 52px 1fr 52px;
  align-items: center;
  min-height: 34px;
  margin-bottom: 16px;
}
.sub-header h1 {
  text-align: center;
  font-size: 18px;
  letter-spacing: -.35px;
}
.back-btn {
  background: transparent;
  border: none;
  font-size: 15px;
  font-weight: 650;
  color: var(--text-main);
  cursor: pointer;
  padding: 6px 0;
  text-align: left;
}

.action-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.search-input {
  min-width: 0;
  flex: 1;
  height: 42px;
  padding: 0 12px;
  border: 1px solid var(--card-border);
  border-radius: 9px;
  background: var(--white);
  color: var(--text-main);
  font-size: 14px;
  outline: none;
}
.search-input:focus { border-color: #bcbcb8; }
.search-input::placeholder { color: #a1a19d; }

.btn-add-item {
  height: 42px;
  background: var(--black);
  color: var(--white);
  border: 1px solid var(--black);
  border-radius: 9px;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
}
.btn-add-item:active { opacity: .82; }

.inventory-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 20px;
}

.inventory-card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 13px 12px 12px;
  min-height: 116px;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: background .12s, border-color .12s, transform .1s;
}

.inventory-card:active {
  background: #fafaf8;
  transform: scale(.995);
}

.inventory-card.shopping-row {
  background: var(--white);
}

.inventory-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}

.inventory-card-info {
  min-width: 0;
  flex: 1;
}

.inventory-card-name {
  font-size: 15px;
  line-height: 1.25;
  font-weight: 750;
  color: var(--text-main);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.inventory-card-meta {
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  color: var(--text-muted);
  font-size: 11px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inventory-card-meta .meta-brand {
  color: var(--text-main);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inventory-card-meta .meta-separator {
  color: #b0b0ac;
}

.inventory-card-bottom {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
  min-height: 38px;
}

.inventory-card-color {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 50%;
  display: inline-block;
  border: 1px solid rgba(0,0,0,.14);
  box-sizing: border-box;
  margin-right: 2px;
}

.qty-container {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  width: 82px;
  height: 36px;
  box-sizing: border-box;
  background: var(--input-bg);
  padding: 3px 5px 3px 9px;
  border-radius: 8px;
  flex: 0 0 82px;
}

.qty-count {
  font-size: 13px;
  font-weight: 750;
  min-width: 16px;
  text-align: center;
}

.qty-arrows {
  display: flex;
  flex-direction: column;
}

.qty-arrow-btn {
  background: none;
  border: none;
  font-size: 8px;
  padding: 0 2px;
  cursor: pointer;
  color: #8a8a86;
  line-height: 1;
}

.qty-arrow-btn:hover { color: var(--text-main); }

.category-select-inline {
  width: 82px;
  height: 36px;
  flex: 0 0 82px;
  box-sizing: border-box;
  margin: 0;
  padding: 0 7px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  font-size: 11px;
  background: var(--white);
  color: var(--text-main);
}

.inventory-card-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  margin-left: auto;
}

.btn-icon-square {
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  background: var(--white);
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .12s, opacity .12s, transform .12s;
  padding: 0;
  margin: 0;
}

.btn-icon-square:active {
  opacity: .7;
  transform: scale(.96);
}

.btn-icon-square svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.btn-icon-edit {
  background: var(--soft-gray-2);
  color: var(--text-main);
}

.btn-icon-delete {
  background: var(--white);
  color: #555b60;
}

.btn-icon-move {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}

.inventory-empty {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 34px 18px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

@media (max-width: 390px) {
  .inventory-card { padding-left: 10px; padding-right: 10px; }
  .inventory-card-bottom { gap: 6px; }
  .inventory-card-actions { gap: 5px; }
  .btn-icon-square { width: 34px; height: 34px; min-width: 34px; min-height: 34px; }
  .inventory-card-color { width: 34px; height: 34px; flex-basis: 34px; }
  .qty-container, .category-select-inline { width: 76px; flex-basis: 76px; height: 34px; }
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,.55);
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 18px;
  box-sizing: border-box;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--white);
  padding: 20px;
  border: 1px solid #e1e1de;
  border-radius: 14px;
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  box-shadow: 0 18px 50px rgba(0,0,0,.12);
}
.modal-content h3 { margin: 0 0 14px; font-size: 17px; text-align: center; letter-spacing: -.2px; }
.modal-content input, .modal-content select {
  width: 100%;
  height: 42px;
  padding: 0 10px;
  margin-bottom: 9px;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--white);
  color: var(--text-main);
  box-sizing: border-box;
  font-size: 14px;
  outline: none;
}
.modal-content input:focus, .modal-content select:focus { border-color: #bcbcb8; }
.modal-btns { display: flex; gap: 8px; margin-top: 10px; }
.modal-btns button {
  flex: 1;
  height: 42px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  cursor: pointer;
  font-weight: 650;
  font-size: 13px;
}
.btn-add-choice {
  background: var(--soft-gray-2);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 14px;
  width: 100%;
  margin-bottom: 9px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text-main);
}
.btn-add-choice:hover { background: var(--soft-gray); }
.btn-save { background: var(--black); color: var(--white); border-color: var(--black) !important; }
.btn-cancel { background: var(--soft-gray); color: var(--text-main); }
.dialog-danger { background: var(--black); color: white; }

.scanner-container {
  position: relative;
  width: 100%;
  height: 260px;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}
#webcamVideo { width: 100%; height: 100%; object-fit: cover; }
.scan-guide {
  position: absolute;
  width: 75%;
  height: 60%;
  border: 2px dashed #fff;
  border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.4);
  pointer-events: none;
}
.loading-text {
  display: none;
  text-align: center;
  color: var(--text-main);
  font-size: 13px;
  margin: 10px 0;
  font-weight: 700;
}
.settings-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--card-border); }
.settings-section-title { font-size: 12px; font-weight: 750; margin-bottom: 8px; }
.settings-secondary-btn {
  width: 100%; height: 40px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--card-border); background: var(--soft-gray-2);
  color: var(--text-main); cursor: pointer; font-weight: 650; font-size: 13px; margin-bottom: 8px;
}
.color-input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.color-input-row input[type="color"] { width: 44px; height: 42px; padding: 2px; margin: 0; cursor: pointer; }
.color-hex-input { flex: 1; margin: 0 !important; }
.custom-dialog-message { font-size: 14px; line-height: 1.55; color: var(--text-main); text-align: center; white-space: pre-line; margin: 0 0 14px; }
</style>
</head>
<body>

<div class="app-container">
  <!-- 메인 화면 -->
  <div id="mainView" class="view">
    <header>
      <h1>Studio Inventory</h1>
      <button class="icon-btn" onclick="openSettings()" aria-label="설정">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.39-1.04-.72-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.22-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.83 8.62a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.08.63-.08.94s.03.63.08.94L2.95 14.3a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.5.39 1.04.72 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.22 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.36ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
    </header>
    <div class="category-grid">
      <div class="category-card" onclick="openCategory('ACRYLIC')">
        <span class="category-name">ACRYLIC</span>
      </div>
      <div class="category-card" onclick="openCategory('OIL')">
        <span class="category-name">OIL</span>
      </div>
      <div class="category-card" onclick="openCategory('DRAWING')">
        <span class="category-name">DRAWING</span>
      </div>
      <div class="category-card" onclick="openCategory('MEDIUMS')">
        <span class="category-name">MEDIUMS</span>
      </div>
      <div class="category-card" onclick="openCategory('OTHERS')">
        <span class="category-name">OTHERS</span>
      </div>
      <div class="category-card shopping-card" onclick="openCategory('SHOPPING_LIST')">
        <span class="category-name">SHOPPING LIST</span>
      </div>
    </div>
  </div>

  <!-- 상세 화면 -->
  <div id="detailView" class="view">
    <div class="sub-header">
      <button class="back-btn" onclick="showMainView()">‹ Back</button>
      <h1 id="categoryTitle">ACRYLIC</h1>
      <div></div>
    </div>
    <div class="action-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search items..." oninput="renderCategoryItems()">
      <button class="btn-add-item" onclick="openAddChoiceModal()">+ Add Item</button>
    </div>
    <div id="inventoryTableBody" class="inventory-list" aria-live="polite"></div>
  </div>
</div>

<!-- 모달 팝업들 -->
<div id="addChoiceModal" class="modal">
  <div class="modal-content">
    <h3>+ 항목 추가 방식</h3>
    <button class="btn-add-choice" onclick="triggerNativeCamera()">📷 카메라 촬영 (권장)</button>
    <button class="btn-add-choice" onclick="startLiveScanner()">📹 라이브 스캐너</button>
    <button class="btn-add-choice" onclick="openManualAddModal()">✏️ 직접 입력</button>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('addChoiceModal')">취소</button>
    </div>
  </div>
</div>

<!-- 네이티브 카메라 파일 입력 (iOS 완벽 호환) -->
<input type="file" id="nativeCameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleNativeImage(event)">

<div id="scannerModal" class="modal">
  <div class="modal-content">
    <h3>📷 라이브 카메라 스캔</h3>
    <div class="scanner-container">
      <video id="webcamVideo" autoplay playsinline muted></video>
      <div class="scan-guide"></div>
    </div>
    <canvas id="captureCanvas" style="display:none;"></canvas>
    <div id="scanLoadingText" class="loading-text">AI가 라벨을 분석 중입니다...</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="stopLiveScanner()">취소</button>
      <button class="btn-save" onclick="captureAndAnalyze()">스캔하기</button>
    </div>
  </div>
</div>

<div id="confirmCategoryModal" class="modal">
  <div class="modal-content">
    <h3>카테고리 지정 필요</h3>
    <p style="font-size: 13px; color: var(--text-muted); text-align: center;">AI가 카테고리를 확정하지 못했습니다. 분류를 선택해 주세요.</p>
    <input type="hidden" id="pendingItemData">
    <select id="manualCategorySelect">
      <option value="ACRYLIC">ACRYLIC (아크릴)</option>
      <option value="OIL">OIL (오일)</option>
      <option value="DRAWING">DRAWING (드로잉재료)</option>
      <option value="MEDIUMS">MEDIUMS (미디엄)</option>
      <option value="OTHERS" selected>OTHERS (기타)</option>
    </select>
    <div class="modal-btns">
      <button class="btn-save" onclick="confirmPendingCategory()">저장하기</button>
    </div>
  </div>
</div>

<div id="moveCategoryModal" class="modal">
  <div class="modal-content">
    <h3>카테고리 이동</h3>
    <p id="moveItemTargetName" style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: -5px; margin-bottom: 15px;"></p>
    <input type="hidden" id="moveTargetItemId">
    <select id="targetCategorySelect">
      <option value="ACRYLIC">ACRYLIC (아크릴)</option>
      <option value="OIL">OIL (오일)</option>
      <option value="DRAWING">DRAWING (드로잉)</option>
      <option value="MEDIUMS">MEDIUMS (미디엄)</option>
      <option value="OTHERS">OTHERS (기타)</option>
      <option value="SHOPPING_LIST">SHOPPING LIST (쇼핑리스트)</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('moveCategoryModal')">취소</button>
      <button class="btn-save" onclick="executeCategoryMove()">이동하기</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h3>API 키 설정</h3>
    <input type="password" id="apiKeyInput" placeholder="Google Gemini API Key">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('settingsModal')">취소</button>
      <button class="btn-save" onclick="saveApiKey()">저장</button>
    </div>
  </div>
</div>

<div id="itemModal" class="modal">
  <div class="modal-content">
    <h3 id="itemModalTitle">재료 등록</h3>
    <input type="hidden" id="editItemId">
    <div id="categorySelectGroup" style="display: none; margin-bottom: 10px;">
      <label style="font-size: 11px; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 4px;">카테고리 선택</label>
      <select id="inputCategory">
        <option value="ACRYLIC">ACRYLIC</option>
        <option value="OIL">OIL</option>
        <option value="DRAWING">DRAWING</option>
        <option value="MEDIUMS">MEDIUMS</option>
        <option value="OTHERS" selected>OTHERS</option>
      </select>
    </div>
    <input type="text" id="inputBrand" placeholder="브랜드 (예: 신한, 홀베인)">
    <input type="text" id="inputName" placeholder="재료/색상명 (예: 울트라마린 블루)">
    <input type="text" id="inputCapacity" placeholder="용량 (예: 50ml, 12색)">
    <div class="color-input-row">
      <input type="color" id="inputColorHex" value="#cbd5e1" title="색상 선택">
      <input type="text" id="inputColorText" class="color-hex-input" placeholder="색상 HEX (예: #1e40af)" maxlength="7">
    </div>
    <input type="number" id="inputQty" placeholder="수량" value="1" min="0">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('itemModal')">취소</button>
      <button class="btn-save" onclick="saveManualItem()">저장</button>
    </div>
  </div>
</div>

<script>
const GEMINI_MODEL = "gemini-2.5-flash";
let currentCategory = '';
let mediaStream = null;

// iOS Safari 핀치 줌 제스처 방지
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

function showMainView() {
  const detailView = document.getElementById('detailView');
  const mainView = document.getElementById('mainView');
  
  detailView.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease';
  detailView.style.transform = 'translateX(100%)';
  detailView.style.opacity = '1';
  mainView.style.transform = 'scale(1)';
  mainView.style.opacity = '1';
  
  detailView.classList.remove('active');
}

function openCategory(cat) {
  currentCategory = cat;
  document.getElementById('categoryTitle').innerText = (cat === 'SHOPPING_LIST') ? 'SHOPPING LIST' : cat;
  document.getElementById('searchInput').value = '';
  
  const detailView = document.getElementById('detailView');
  const mainView = document.getElementById('mainView');
  
  detailView.style.transition = 'none';
  detailView.style.transform = 'translateX(100%)';
  detailView.style.opacity = '1';
  
  mainView.style.transition = 'none';
  mainView.style.transform = 'scale(1)';
  mainView.style.opacity = '1';

  detailView.classList.add('active');
  renderCategoryItems();
  
  requestAnimationFrame(() => {
    detailView.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease';
    detailView.style.transform = 'translateX(0)';
    
    mainView.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease';
    mainView.style.transform = 'scale(0.92)';
    mainView.style.opacity = '0.6';
  });
}

function openAddChoiceModal() {
  document.getElementById('addChoiceModal').classList.add('active');
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('active');
}

const INVENTORY_KEY = 'art_inventory';
const SHOPPING_KEY = 'art_shopping';

function getStorageKey() {
  return (currentCategory === 'SHOPPING_LIST') ? SHOPPING_KEY : INVENTORY_KEY;
}

function getItems(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key) || '[]');
    return Array.isArray(data) ? data : [];
  } catch (error) {
    console.error('데이터 읽기 실패:', error);
    return [];
  }
}

function saveItems(key, items) {
  try {
    localStorage.setItem(key, JSON.stringify(items));
    return true;
  } catch (error) {
    console.error('데이터 저장 실패:', error);
    showAlert('저장 실패', '저장 공간이 부족하거나 저장이 차단되어 있습니다.');
    return false;
  }
}

function guessColorCode(name) {
  if (!name) return '#cbd5e1';
  const lower = name.toLowerCase();
  if (lower.includes('white') || lower.includes('화이트') || lower.includes('백색')) return '#ffffff';
  if (lower.includes('black') || lower.includes('블랙') || lower.includes('검정')) return '#0f172a';
  if (lower.includes('ultramarine') || lower.includes('울트라마린')) return '#1e40af';
  if (lower.includes('cobalt blue') || lower.includes('코발트 블루')) return '#2563eb';
  if (lower.includes('cerulean') || lower.includes('세룰리안')) return '#0284c7';
  if (lower.includes('phthalo blue') || lower.includes('프탈로 블루')) return '#0369a1';
  if (lower.includes('blue') || lower.includes('블루') || lower.includes('청')) return '#3b82f6';
  if (lower.includes('cadmium red') || lower.includes('카드뮴 레드')) return '#dc2626';
  if (lower.includes('vermilion') || lower.includes('버밀리언') || lower.includes('주홍')) return '#ea580c';
  if (lower.includes('crimson') || lower.includes('크림슨') || lower.includes('alizarin')) return '#991b1b';
  if (lower.includes('magenta') || lower.includes('마젠타')) return '#db2777';
  if (lower.includes('pink') || lower.includes('핑크')) return '#f472b6';
  if (lower.includes('red') || lower.includes('레드') || lower.includes('빨강')) return '#ef4444';
  if (lower.includes('lemon') || lower.includes('레몬')) return '#fef08a';
  if (lower.includes('cadmium yellow') || lower.includes('카드뮴 옐로우')) return '#eab308';
  if (lower.includes('yellow') || lower.includes('옐로우') || lower.includes('노랑')) return '#facc15';
  if (lower.includes('ochre') || lower.includes('오커') || lower.includes('황토')) return '#ca8a04';
  if (lower.includes('orange') || lower.includes('오렌지') || lower.includes('주황')) return '#f97316';
  if (lower.includes('viridian') || lower.includes('비리디안')) return '#047857';
  if (lower.includes('sap green') || lower.includes('새프 그린')) return '#15803d';
  if (lower.includes('phthalo green') || lower.includes('프탈로 그린')) return '#065f46';
  if (lower.includes('green') || lower.includes('그린') || lower.includes('초록')) return '#22c55e';
  if (lower.includes('violet') || lower.includes('바이올렛') || lower.includes('purple') || lower.includes('퍼플') || lower.includes('보라')) return '#7c3aed';
  if (lower.includes('burnt sienna') || lower.includes('번트 시엔나')) return '#9a3412';
  if (lower.includes('raw umber') || lower.includes('로 엄버') || lower.includes('burnt umber') || lower.includes('번트 엄버')) return '#78350f';
  if (lower.includes('brown') || lower.includes('브라운') || lower.includes('갈색')) return '#a16207';
  if (lower.includes('grey') || lower.includes('gray') || lower.includes('그레이') || lower.includes('회색')) return '#64748b';
  return '#cbd5e1';
}

let longPressTimer = null;
function attachLongPressListener(trElement, itemId) {
  const startHandler = () => {
    longPressTimer = setTimeout(() => {
      if (navigator.vibrate) navigator.vibrate(40);
      openMoveCategoryModal(itemId);
    }, 500);
  };
  const cancelHandler = () => clearTimeout(longPressTimer);

  trElement.addEventListener('touchstart', startHandler, { passive: true });
  trElement.addEventListener('touchend', cancelHandler);
  trElement.addEventListener('touchmove', cancelHandler);
  trElement.addEventListener('mousedown', startHandler);
  trElement.addEventListener('mouseup', cancelHandler);
  trElement.addEventListener('mouseleave', cancelHandler);
}

function openMoveCategoryModal(itemId) {
  const key = getStorageKey();
  const items = getItems(key);
  const item = items.find(i => i.id == itemId);
  if (!item) return;

  document.getElementById('moveTargetItemId').value = itemId;
  document.getElementById('moveItemTargetName').innerText = `'${item.name}' 항목을 어디로 이동할까요?`;
  
  const select = document.getElementById('targetCategorySelect');
  select.value = (currentCategory === 'SHOPPING_LIST') ? 'SHOPPING_LIST' : (item.category || 'OTHERS');

  document.getElementById('moveCategoryModal').classList.add('active');
}

function executeCategoryMove() {
  const itemId = document.getElementById('moveTargetItemId').value;
  const newCategory = document.getElementById('targetCategorySelect').value;
  const currentKey = getStorageKey();
  let currentItems = getItems(currentKey);

  const itemIndex = currentItems.findIndex(i => i.id == itemId);
  if (itemIndex === -1) return;

  const [item] = currentItems.splice(itemIndex, 1);

  if (newCategory === 'SHOPPING_LIST') {
    saveItems(currentKey, currentItems);
    let shoppingItems = getItems(SHOPPING_KEY);
    item.category = 'OTHERS';
    shoppingItems.push(item);
    saveItems(SHOPPING_KEY, shoppingItems);
  } else if (currentCategory === 'SHOPPING_LIST') {
    saveItems(SHOPPING_KEY, currentItems);
    let inventoryItems = getItems(INVENTORY_KEY);
    item.category = newCategory;
    inventoryItems.push(item);
    saveItems(INVENTORY_KEY, inventoryItems);
  } else {
    item.category = newCategory;
    currentItems.push(item);
    saveItems(currentKey, currentItems);
  }

  closeModal('moveCategoryModal');
  renderCategoryItems();
}

function changeItemCategory(id, newCat) {
  const key = getStorageKey();
  let items = getItems(key);
  items = items.map(i => {
    if (i.id == id) i.category = newCat;
    return i;
  });
  saveItems(key, items);
  renderCategoryItems();
}

function changeQty(id, delta) {
  const key = getStorageKey();
  let items = getItems(key);
  items = items.map(i => {
    if (i.id == id) i.qty = Math.max(0, i.qty + delta);
    return i;
  });
  saveItems(key, items);
  renderCategoryItems();
}

/* =========================================================
   카메라 호출 (네이티브 파일 피커 방식 + 라이브 스트림)
========================================================= */

function triggerNativeCamera() {
  const apiKey = localStorage.getItem('gemini_api_key');
  if (!apiKey) {
    showAlert('API 키 필요', '설정에서 Gemini API 키를 먼저 입력해주세요.');
    openSettings();
    return;
  }
  closeModal('addChoiceModal');
  document.getElementById('nativeCameraInput').click();
}

async function handleNativeImage(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;

  const apiKey = localStorage.getItem('gemini_api_key');
  showAlert('분석 중', 'AI가 라벨을 분석하고 있습니다. 잠시만 기다려주세요...');

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const base64Data = reader.result.split(',')[1];
      const mimeType = file.type || 'image/jpeg';
      const aiResult = await analyzeImage(base64Data, mimeType, apiKey);

      closeDialog(true);

      if (aiResult) {
        let finalCategory = aiResult.category;
        if (!finalCategory || finalCategory === 'UNKNOWN' || !['ACRYLIC', 'OIL', 'DRAWING', 'MEDIUMS', 'OTHERS'].includes(finalCategory)) {
          document.getElementById('pendingItemData').value = JSON.stringify(aiResult);
          document.getElementById('confirmCategoryModal').classList.add('active');
          return;
        }
        saveScannedItem(aiResult, finalCategory);
        renderCategoryItems();
        showAlert('완료', `'${aiResult.name}' 등록이 완료되었습니다.`);
      }
    } catch (err) {
      closeDialog(true);
      showAlert('분석 실패', err.message);
    }
  };
  reader.readAsDataURL(file);
}

async function startLiveScanner() {
  const apiKey = localStorage.getItem('gemini_api_key');
  if (!apiKey) {
    showAlert('API 키 필요', '설정에서 Gemini API 키를 먼저 입력해주세요.');
    openSettings();
    return;
  }
  closeModal('addChoiceModal');
  document.getElementById('scannerModal').classList.add('active');
  document.getElementById('scanLoadingText').style.display = 'none';

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });
    const video = document.getElementById('webcamVideo');
    video.srcObject = mediaStream;
    video.play();
  } catch (err) {
    showAlert('카메라 오류', '라이브 스트림 접근이 차단되었습니다. 상단의 [카메라 촬영] 방식을 이용해주세요.');
    stopLiveScanner();
  }
}

function stopLiveScanner() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }
  const video = document.getElementById('webcamVideo');
  if (video) video.srcObject = null;
  closeModal('scannerModal');
}

async function captureAndAnalyze() {
  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('captureCanvas');
  const apiKey = localStorage.getItem('gemini_api_key');

  if (!video.videoWidth || !video.videoHeight) {
    showAlert('카메라 준비 중', '카메라 화면이 아직 준비되지 않았습니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const mimeType = 'image/jpeg';
  const base64Data = canvas.toDataURL(mimeType, 0.85).split(',')[1];

  document.getElementById('scanLoadingText').style.display = 'block';

  try {
    const aiResult = await analyzeImage(base64Data, mimeType, apiKey);
    if (aiResult) {
      let finalCategory = aiResult.category;
      
      if (!finalCategory || finalCategory === 'UNKNOWN' || !['ACRYLIC', 'OIL', 'DRAWING', 'MEDIUMS', 'OTHERS'].includes(finalCategory)) {
        stopLiveScanner();
        document.getElementById('pendingItemData').value = JSON.stringify(aiResult);
        document.getElementById('confirmCategoryModal').classList.add('active');
        return;
      }

      saveScannedItem(aiResult, finalCategory);
      stopLiveScanner();
      renderCategoryItems();
    }
  } catch (err) {
    showAlert('스캔 실패', err.message);
  } finally {
    document.getElementById('scanLoadingText').style.display = 'none';
  }
}

function confirmPendingCategory() {
  const rawData = document.getElementById('pendingItemData').value;
  const selectedCat = document.getElementById('manualCategorySelect').value;
  if (rawData) {
    const itemData = JSON.parse(rawData);
    saveScannedItem(itemData, selectedCat);
    closeModal('confirmCategoryModal');
    renderCategoryItems();
  }
}

async function analyzeImage(base64Data, mimeType, apiKey) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  
  const promptText = `Analyze this art supply image and extract details in strictly valid JSON format.
  Categories allowed: ["ACRYLIC", "OIL", "DRAWING", "MEDIUMS", "OTHERS"]
  If you cannot determine the category with high confidence, set "category" as "UNKNOWN".
  
  JSON format:
  {
    "brand": "brand name or empty string",
    "name": "item or color name",
    "capacity": "capacity e.g. 50ml or empty string",
    "category": "one of the allowed categories or UNKNOWN"
  }`;

  const payload = {
    contents: [{
      parts: [
        { text: promptText },
        { inline_data: { mime_type: mimeType, data: base64Data } }
      ]
    }],
    generationConfig: {
      responseMimeType: "application/json"
    }
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData.error?.message || `통신 오류 (${res.status})`);
  }

  const data = await res.json();
  const responseText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

  if (!responseText) {
    throw new Error("이미지에서 정보 추출에 실패했습니다.");
  }

  try {
    const cleanJsonText = responseText.replace(/```json/g, "").replace(/```/g, "").trim();
    return JSON.parse(cleanJsonText);
  } catch (e) {
    throw new Error("AI 응답 데이터 파싱 실패");
  }
}

/* =========================================================
   데이터 및 렌더링 로직
========================================================= */

const BACKUP_VERSION = 2;

function generateId() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return window.crypto.randomUUID();
  }
  return `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

function normalizeHex(value) {
  const hex = String(value || '').trim();
  return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex.toLowerCase() : '';
}

let dialogCallback = null;

function ensureDialog() {
  if (document.getElementById('dialogModal')) return;

  const modal = document.createElement('div');
  modal.id = 'dialogModal';
  modal.className = 'modal';

  const content = document.createElement('div');
  content.className = 'modal-content';

  const title = document.createElement('h3');
  title.id = 'dialogTitle';

  const message = document.createElement('p');
  message.id = 'dialogMessage';
  message.className = 'custom-dialog-message';

  const buttons = document.createElement('div');
  buttons.className = 'modal-btns';

  const cancel = document.createElement('button');
  cancel.id = 'dialogCancel';
  cancel.className = 'btn-cancel';
  cancel.type = 'button';
  cancel.textContent = '취소';
  cancel.onclick = () => closeDialog(false);

  const confirm = document.createElement('button');
  confirm.id = 'dialogConfirm';
  confirm.className = 'btn-save';
  confirm.type = 'button';
  confirm.textContent = '확인';
  confirm.onclick = () => closeDialog(true);

  buttons.append(cancel, confirm);
  content.append(title, message, buttons);
  modal.appendChild(content);
  document.body.appendChild(modal);
}

function showAlert(title, message, onClose = null) {
  ensureDialog();

  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogMessage').textContent = message;
  document.getElementById('dialogCancel').style.display = 'none';

  const confirm = document.getElementById('dialogConfirm');
  confirm.textContent = '확인';
  confirm.className = 'btn-save';

  dialogCallback = result => {
    if (result && onClose) onClose();
  };

  document.getElementById('dialogModal').classList.add('active');
}

function showConfirm(title, message, onResult, confirmText = '확인', danger = false) {
  ensureDialog();

  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogMessage').textContent = message;
  document.getElementById('dialogCancel').style.display = 'block';

  const confirm = document.getElementById('dialogConfirm');
  confirm.textContent = confirmText;
  confirm.className = danger ? 'btn-save dialog-danger' : 'btn-save';

  dialogCallback = onResult;
  document.getElementById('dialogModal').classList.add('active');
}

function closeDialog(result) {
  const callback = dialogCallback;
  dialogCallback = null;
  document.getElementById('dialogModal').classList.remove('active');
  if (callback) callback(result);
}

function openSettings() {
  const modal = document.getElementById('settingsModal');
  const input = document.getElementById('apiKeyInput');

  input.value = localStorage.getItem('gemini_api_key') || '';

  if (!document.getElementById('backupSection')) {
    const section = document.createElement('div');
    section.id = 'backupSection';
    section.className = 'settings-section';

    const title = document.createElement('div');
    title.className = 'settings-section-title';
    title.textContent = '데이터 백업';

    const exportBtn = document.createElement('button');
    exportBtn.className = 'settings-secondary-btn';
    exportBtn.type = 'button';
    exportBtn.textContent = '⬇️ JSON로 내보내기';
    exportBtn.onclick = exportData;

    const importBtn = document.createElement('button');
    importBtn.className = 'settings-secondary-btn';
    importBtn.type = 'button';
    importBtn.textContent = '⬆️ JSON 가져오기';

    const fileInput = document.createElement('input');
    fileInput.id = 'backupFileInput';
    fileInput.type = 'file';
    fileInput.accept = '.json,application/json';
    fileInput.style.display = 'none';
    fileInput.onchange = importBackupFile;

    importBtn.onclick = () => fileInput.click();

    section.append(title, exportBtn, importBtn, fileInput);

    const buttons = modal.querySelector('.modal-btns');
    buttons.parentNode.insertBefore(section, buttons);
  }

  modal.classList.add('active');
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();

  if (!key) {
    showAlert('입력 필요', 'Gemini API 키를 입력해주세요.');
    return;
  }

  try {
    localStorage.setItem('gemini_api_key', key);
    showAlert('저장 완료', 'Gemini API 키가 저장되었습니다.', () => {
      closeModal('settingsModal');
    });
  } catch (error) {
    showAlert('저장 실패', 'API 키를 저장할 수 없습니다.');
  }
}

function exportData() {
  const backup = {
    app: 'Studio Inventory & Shopping List',
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    inventory: getItems(INVENTORY_KEY),
    shopping: getItems(SHOPPING_KEY)
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: 'application/json;charset=utf-8' }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);

  link.href = url;
  link.download = `studio-inventory-backup-${date}.json`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
  showAlert('내보내기 완료', '재고와 쇼핑 리스트 데이터를 JSON 파일로 저장했습니다.');
}

function importBackupFile(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);

      if (!Array.isArray(data.inventory) || !Array.isArray(data.shopping)) {
        throw new Error('Invalid backup format');
      }

      const inventory = normalizeImportedItems(data.inventory);
      const shopping = normalizeImportedItems(data.shopping);

      showConfirm(
        '데이터 가져오기',
        `현재 데이터를 백업 파일의 데이터로 교체합니다.\n\n재고 ${inventory.length}개 / 쇼핑 리스트 ${shopping.length}개\n\n계속하시겠습니까?`,
        confirmed => {
          if (!confirmed) return;

          if (
            saveItems(INVENTORY_KEY, inventory) &&
            saveItems(SHOPPING_KEY, shopping)
          ) {
            renderCategoryItems();
            showAlert('가져오기 완료', '백업 데이터를 성공적으로 복원했습니다.');
          }
        },
        '가져오기'
      );

    } catch (error) {
      console.error(error);
      showAlert('가져오기 실패', '올바른 Studio Inventory 백업 JSON 파일이 아닙니다.');
    }
  };

  reader.onerror = () => {
    showAlert('가져오기 실패', '파일을 읽을 수 없습니다.');
  };

  reader.readAsText(file, 'utf-8');
}

function normalizeImportedItems(items) {
  return items.map(item => ({
    id: item.id || generateId(),
    category: ['ACRYLIC', 'OIL', 'DRAWING', 'MEDIUMS', 'OTHERS'].includes(item.category)
      ? item.category
      : 'OTHERS',
    brand: typeof item.brand === 'string' ? item.brand : '기타',
    name: typeof item.name === 'string' ? item.name : '알 수 없는 재료',
    capacity: typeof item.capacity === 'string' ? item.capacity : '',
    colorHex: normalizeHex(item.colorHex),
    qty: Math.max(0, Number(item.qty) || 0)
  }));
}

function setupColorInputs() {
  const picker = document.getElementById('inputColorHex');
  const text = document.getElementById('inputColorText');

  if (!picker || !text || picker.dataset.colorInputBound) return;

  picker.dataset.colorInputBound = '1';
  text.dataset.colorInputBound = '1';

  picker.addEventListener('input', () => {
    text.value = picker.value.toLowerCase();
  });

  text.addEventListener('input', () => {
    const value = normalizeHex(text.value);
    if (value) picker.value = value;
  });
}

function setColorInputs(color) {
  setupColorInputs();
  const picker = document.getElementById('inputColorHex');
  const text = document.getElementById('inputColorText');
  const normalized = normalizeHex(color) || '#cbd5e1';

  picker.value = normalized;
  text.value = normalizeHex(color) ? normalized : '';
}

function resolveItemColor(name, explicit) {
  const direct = normalizeHex(explicit);
  return direct || guessColorCode(name);
}

function createActionButton(className, iconName, title, handler) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = `btn-icon-square ${className}`;
  button.title = title;
  button.setAttribute('aria-label', title);

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');

  const path = document.createElementNS(svgNS, 'path');

  if (iconName === 'edit') {
    path.setAttribute('d', 'M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Zm10.8-12.8 2 2');
  } else if (iconName === 'delete') {
    path.setAttribute('d', 'M5 7h14M10 11v6m4-6v6M9 7V5h6v2m-8 0 1 14h8l1-14');
  } else if (iconName === 'check') {
    path.setAttribute('d', 'm5 12 4 4L19 6');
  }

  svg.appendChild(path);
  button.appendChild(svg);

  button.addEventListener('click', event => {
    event.stopPropagation();
    handler();
  });

  return button;
}

function renderCategoryItems() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const storageKey = currentCategory === 'SHOPPING_LIST' ? SHOPPING_KEY : INVENTORY_KEY;

  let items = getItems(storageKey);

  if (currentCategory !== 'SHOPPING_LIST') {
    items = items.filter(item => item.category === currentCategory);
  }

  if (query) {
    items = items.filter(item =>
      String(item.name || '').toLowerCase().includes(query) ||
      String(item.brand || '').toLowerCase().includes(query)
    );
  }

  const list = document.getElementById('inventoryTableBody');
  list.replaceChildren();

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'inventory-empty';
    empty.textContent = '등록된 재료가 없습니다.';
    list.appendChild(empty);
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'inventory-card';
    if (currentCategory === 'SHOPPING_LIST') card.classList.add('shopping-row');

    if (typeof attachLongPressListener === 'function') {
      attachLongPressListener(card, item.id);
    }

    const top = document.createElement('div');
    top.className = 'inventory-card-top';

    const info = document.createElement('div');
    info.className = 'inventory-card-info';

    const name = document.createElement('div');
    name.className = 'inventory-card-name';
    name.textContent = item.name || '이름 없음';
    info.appendChild(name);

    const meta = document.createElement('div');
    meta.className = 'inventory-card-meta';

    if (item.capacity) {
      const capacity = document.createElement('span');
      capacity.textContent = item.capacity;
      meta.appendChild(capacity);
    }

    if (item.capacity && item.brand) {
      const separator = document.createElement('span');
      separator.className = 'meta-separator';
      separator.textContent = '·';
      meta.appendChild(separator);
    }

    const brand = document.createElement('span');
    brand.className = 'meta-brand';
    brand.textContent = item.brand || '기타';
    meta.appendChild(brand);

    info.appendChild(meta);
    top.appendChild(info);
    card.appendChild(top);

    const bottom = document.createElement('div');
    bottom.className = 'inventory-card-bottom';

    const color = document.createElement('span');
    color.className = 'inventory-card-color';
    const resolvedColor = resolveItemColor(item.name, item.colorHex);
    color.style.backgroundColor = resolvedColor;
    color.title = resolvedColor;
    color.setAttribute('aria-label', `색상 ${resolvedColor}`);
    bottom.appendChild(color);

    const qtyContainer = document.createElement('div');
    qtyContainer.className = 'qty-container';
    qtyContainer.onclick = event => event.stopPropagation();

    const qtyCount = document.createElement('span');
    qtyCount.className = 'qty-count';
    qtyCount.textContent = String(item.qty ?? 0);

    const arrows = document.createElement('div');
    arrows.className = 'qty-arrows';

    const up = document.createElement('button');
    up.type = 'button';
    up.className = 'qty-arrow-btn';
    up.textContent = '▲';
    up.title = '수량 증가';
    up.setAttribute('aria-label', '수량 증가');
    up.onclick = event => {
      event.stopPropagation();
      changeQty(item.id, 1);
    };

    const down = document.createElement('button');
    down.type = 'button';
    down.className = 'qty-arrow-btn';
    down.textContent = '▼';
    down.title = '수량 감소';
    down.setAttribute('aria-label', '수량 감소');
    down.onclick = event => {
      event.stopPropagation();
      changeQty(item.id, -1);
    };

    arrows.append(up, down);
    qtyContainer.append(qtyCount, arrows);
    bottom.appendChild(qtyContainer);

    if (currentCategory === 'SHOPPING_LIST') {
      const select = document.createElement('select');
      select.className = 'category-select-inline';
      select.onclick = event => event.stopPropagation();
      select.onchange = event => changeItemCategory(item.id, event.target.value);

      [
        ['ACRYLIC', '아크릴'],
        ['OIL', '오일'],
        ['DRAWING', '드로잉'],
        ['MEDIUMS', '미디엄'],
        ['OTHERS', '기타']
      ].forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        option.selected = item.category === value;
        select.appendChild(option);
      });

      bottom.appendChild(select);
    }

    const actions = document.createElement('div');
    actions.className = 'inventory-card-actions';
    actions.onclick = event => event.stopPropagation();

    actions.appendChild(
      createActionButton(
        'btn-icon-edit',
        'edit',
        '수정',
        () => openEditModal(item.id)
      )
    );

    actions.appendChild(
      createActionButton(
        'btn-icon-delete',
        'delete',
        '삭제',
        () => deleteItem(item.id)
      )
    );

    if (currentCategory === 'SHOPPING_LIST') {
      actions.appendChild(
        createActionButton(
          'btn-icon-move',
          'check',
          '구매 완료 (재고로 이동)',
          () => moveToInventory(item.id)
        )
      );
    }

    bottom.appendChild(actions);
    card.appendChild(bottom);
    list.appendChild(card);
  });
}

function deleteItem(id) {
  const key = currentCategory === 'SHOPPING_LIST' ? SHOPPING_KEY : INVENTORY_KEY;
  const items = getItems(key);
  const target = items.find(item => item.id == id);
  if (!target) return;

  showConfirm(
    '항목 삭제',
    `'${target.name || '이 항목'}'을(를) 삭제하시겠습니까?`,
    confirmed => {
      if (!confirmed) return;
      const updated = items.filter(item => item.id != id);
      if (saveItems(key, updated)) {
        renderCategoryItems();
      }
    },
    '삭제',
    true
  );
}

function moveToInventory(id) {
  const shopping = getItems(SHOPPING_KEY);
  const target = shopping.find(item => item.id == id);
  if (!target) return;

  showConfirm(
    '구매 완료',
    `'${target.name || '항목'}'을(를) 구매 완료하고 재고로 이동할까요?`,
    confirmed => {
      if (!confirmed) return;

      const updatedShopping = shopping.filter(item => item.id != id);
      const inventory = getItems(INVENTORY_KEY);

      const duplicateIndex = inventory.findIndex(item =>
        item.brand === target.brand &&
        item.name === target.name &&
        item.category === target.category
      );

      if (duplicateIndex >= 0) {
        inventory[duplicateIndex].qty =
          Math.max(0, Number(inventory[duplicateIndex].qty) || 0) +
          Math.max(0, Number(target.qty) || 0);
      } else {
        inventory.push({
          ...target,
          id: generateId()
        });
      }

      if (!saveItems(SHOPPING_KEY, updatedShopping)) return;
      if (!saveItems(INVENTORY_KEY, inventory)) return;

      renderCategoryItems();
    },
    '이동하기'
  );
}

function openManualAddModal() {
  closeModal('addChoiceModal');

  document.getElementById('itemModalTitle').textContent = '재료 직접 등록';
  document.getElementById('editItemId').value = '';
  document.getElementById('inputBrand').value = '';
  document.getElementById('inputName').value = '';
  document.getElementById('inputCapacity').value = '';
  document.getElementById('inputQty').value = '1';

  setColorInputs('');

  const group = document.getElementById('categorySelectGroup');
  if (currentCategory === 'SHOPPING_LIST') {
    group.style.display = 'block';
    document.getElementById('inputCategory').value = 'OTHERS';
  } else {
    group.style.display = 'none';
  }

  document.getElementById('itemModal').classList.add('active');
}

function openEditModal(id) {
  const key = currentCategory === 'SHOPPING_LIST' ? SHOPPING_KEY : INVENTORY_KEY;
  const item = getItems(key).find(i => i.id == id);
  if (!item) return;

  document.getElementById('itemModalTitle').textContent = '재료 정보 수정';
  document.getElementById('editItemId').value = item.id;
  document.getElementById('inputBrand').value = item.brand || '';
  document.getElementById('inputName').value = item.name || '';
  document.getElementById('inputCapacity').value = item.capacity || '';
  document.getElementById('inputQty').value = item.qty ?? 1;

  setColorInputs(item.colorHex || '');

  const group = document.getElementById('categorySelectGroup');
  if (currentCategory === 'SHOPPING_LIST') {
    group.style.display = 'block';
    document.getElementById('inputCategory').value = item.category || 'OTHERS';
  } else {
    group.style.display = 'none';
  }

  document.getElementById('itemModal').classList.add('active');
}

function saveManualItem() {
  const id = document.getElementById('editItemId').value;
  const brand = document.getElementById('inputBrand').value.trim();
  const name = document.getElementById('inputName').value.trim();
  const capacity = document.getElementById('inputCapacity').value.trim();
  const qty = Math.max(0, parseInt(document.getElementById('inputQty').value, 10) || 0);
  const category = currentCategory === 'SHOPPING_LIST' ? document.getElementById('inputCategory').value : currentCategory;
  const colorHex = normalizeHex(document.getElementById('inputColorText').value);

  if (!name) {
    showAlert('입력 필요', '재료 이름을 입력해주세요.');
    return;
  }

  const key = currentCategory === 'SHOPPING_LIST' ? SHOPPING_KEY : INVENTORY_KEY;
  let items = getItems(key);

  if (id) {
    const duplicate = items.find(item =>
      String(item.id) !== String(id) &&
      item.brand === brand &&
      item.name === name &&
      item.category === category
    );

    if (duplicate) {
      showConfirm(
        '중복 항목',
        `'${name}'은(는) 이미 같은 브랜드와 카테고리로 등록되어 있습니다.\n\n기존 항목에 수량을 합치고 현재 항목을 삭제할까요?`,
        confirmed => {
          if (!confirmed) return;
          duplicate.qty = Math.max(0, Number(duplicate.qty) || 0) + qty;
          items = items.filter(item => String(item.id) !== String(id));
          if (saveItems(key, items)) {
            closeModal('itemModal');
            renderCategoryItems();
          }
        },
        '합치기'
      );
      return;
    }

    items = items.map(item => {
      if (String(item.id) === String(id)) {
        return { ...item, category, brand, name, capacity, colorHex, qty };
      }
      return item;
    });

  } else {
    const duplicate = items.find(item =>
      item.brand === brand &&
      item.name === name &&
      item.category === category
    );

    if (duplicate) {
      showConfirm(
        '중복 항목',
        `'${name}'은(는) 이미 같은 브랜드와 카테고리로 등록되어 있습니다.\n\n새 항목으로 추가하지 않고 기존 항목의 수량을 ${qty}개 늘릴까요?`,
        confirmed => {
          if (!confirmed) return;
          duplicate.qty = Math.max(0, Number(duplicate.qty) || 0) + qty;
          if (saveItems(key, items)) {
            closeModal('itemModal');
            renderCategoryItems();
          }
        },
        '수량 합치기'
      );
      return;
    }

    items.push({
      id: generateId(),
      category,
      brand,
      name,
      capacity,
      colorHex,
      qty
    });
  }

  if (saveItems(key, items)) {
    closeModal('itemModal');
    renderCategoryItems();
  }
}

function saveScannedItem(aiResult, category) {
  const key = currentCategory === 'SHOPPING_LIST' ? SHOPPING_KEY : INVENTORY_KEY;
  const brand = aiResult.brand?.trim() || '기타';
  const name = aiResult.name?.trim() || '알 수 없는 재료';
  const capacity = aiResult.capacity?.trim() || '';

  const items = getItems(key);
  const duplicate = items.find(item =>
    item.brand === brand &&
    item.name === name &&
    item.category === category
  );

  if (duplicate) {
    duplicate.qty = Math.max(0, Number(duplicate.qty) || 0) + 1;
  } else {
    items.push({
      id: generateId(),
      category,
      brand,
      name,
      capacity,
      colorHex: '',
      qty: 1
    });
  }

  saveItems(key, items);
}

/* =========================================================
   뒤로가기 스와이프 제스처
========================================================= */
(function setupBackSwipe() {
  const detail = document.getElementById('detailView');
  if (!detail) return;

  const EDGE = 32;
  const THRESHOLD = 70;
  const DECISION = 10;

  let tracking = false;
  let decided = false;
  let startX = 0;
  let startY = 0;
  let horizontalBack = false;

  const modalOpen = () => document.querySelector('.modal.active') !== null;

  function reset() {
    tracking = false;
    decided = false;
    horizontalBack = false;
    startX = 0;
    startY = 0;
  }

  document.addEventListener('touchstart', (event) => {
    if (!detail.classList.contains('active')) return;
    if (modalOpen()) return;
    if (event.touches.length !== 1) return;

    const t = event.touches[0];
    if (t.clientX > EDGE) return;

    tracking = true;
    decided = false;
    horizontalBack = false;
    startX = t.clientX;
    startY = t.clientY;
  }, { passive: true });

  document.addEventListener('touchmove', (event) => {
    if (!tracking) return;
    if (event.touches.length !== 1) {
      reset();
      return;
    }

    const t = event.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    if (!decided) {
      if (Math.abs(dx) < DECISION && Math.abs(dy) < DECISION) return;
      decided = true;

      if (Math.abs(dy) >= Math.abs(dx) || dx <= 0) {
        reset();
        return;
      }
      horizontalBack = true;
    }

    if (horizontalBack && dx > 0) {
      event.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchend', (event) => {
    if (!tracking) return;
    const t = event.changedTouches && event.changedTouches[0];
    const dx = t ? t.clientX - startX : 0;
    const shouldGoBack = horizontalBack && dx >= THRESHOLD;

    reset();

    if (shouldGoBack && detail.classList.contains('active') && !modalOpen()) {
      if (typeof showMainView === 'function') showMainView();
    }
  }, { passive: true });

  document.addEventListener('touchcancel', reset, { passive: true });
})();
</script>
