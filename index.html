<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saltly Style Studio Inventory</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --card-border: #262b36;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #1f2430;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="password"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: var(--accent-gradient);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.85;
        }

        .btn-secondary {
            background: #262b36;
            color: var(--text-main);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
            margin-top: 0;
        }

        .loading {
            display: none;
            text-align: center;
            color: #a855f7;
            font-size: 13px;
            margin-top: 12px;
            font-weight: 500;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 24px 0 12px 4px;
            color: var(--text-main);
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info strong {
            display: block;
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .item-info div {
            font-size: 12px;
            color: var(--text-muted);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            margin: 0;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .qty-count {
            font-size: 14px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <span class="brand-badge">SALTLY INSPIRED AI</span>
        <h1>🎨 Studio Inventory</h1>
    </header>

    <!-- 1. API 키 설정 -->
    <div class="card">
        <label>🔑 GEMINI API KEY</label>
        <input type="password" id="apiKey" placeholder="Google AI Studio Key">
        <button onclick="saveApiKey()">키 저장하기</button>
    </div>

    <!-- 2. 사진 촬영 및 AI 분석 -->
    <div class="card">
        <label>📸 SCAN MATERIAL</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment">
        <div id="loading" class="loading">✨ Saltly AI가 이미지를 분석하는 중...</div>
    </div>

    <!-- 3. 재고 목록 -->
    <div class="section-title">📦 Inventory List</div>
    <ul id="itemList" class="item-list"></ul>

    <script>
        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API 키가 성공적으로 저장되었습니다.');
            } else {
                alert('올바른 API 키를 입력해주세요.');
            }
        }

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('apiKey').value = savedKey;
            renderItems();
        }

        document.getElementById('imageInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('먼저 API 키를 입력하고 저장해주세요.');
                return;
            }

            document.getElementById('loading').style.display = 'block';

            try {
                const base64Image = await convertBase64(file);
                const aiData = await analyzeImageWithGemini(base64Image, apiKey);
                
                if (aiData) {
                    saveItem(aiData);
                    renderItems();
                }
            } catch (err) {
                alert('오류 발생: ' + err.message);
                console.error(err);
            } finally {
                document.getElementById('loading').style.display = 'none';
                e.target.value = '';
            }
        });

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function analyzeImageWithGemini(base64Data, apiKey) {
            // 공식 지원 모델명 gemini-1.5-flash 사용
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            // JSON 응답을 확실히 보장하기 위한 프롬프트
            const prompt = "Analyze this art material image. Return ONLY a JSON object. Translate values to Korean if possible. Required keys: 'brand' (Brand Name), 'name' (Color or Material Name), 'capacity' (Capacity/Volume), 'type' (Paint/Medium/etc).";

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                    ]
                }],
                // 확실한 JSON 반환을 위한 설정 추가
                generationConfig: {
                    response_mime_type: "application/json"
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API 호출 실패');
            }

            const data = await response.json();
            const textResult = data.candidates[0].content.parts[0].text;
            
            return JSON.parse(textResult);
        }

        function saveItem(item) {
            const items = JSON.parse(localStorage.getItem('art_items') || '[]');
            items.push({ ...item, id: Date.now(), qty: 1 });
            localStorage.setItem('art_items', JSON.stringify(items));
        }

        function deleteItem(id) {
            let items = JSON.parse(localStorage.getItem('art_items') || '[]');
            items = items.filter(i => i.id !== id);
            localStorage.setItem('art_items', JSON.stringify(items));
            renderItems();
        }

        function changeQty(id, delta) {
            let items = JSON.parse(localStorage.getItem('art_items') || '[]');
            items = items.map(i => {
                if(i.id === id) i.qty = Math.max(0, i.qty + delta);
                return i;
            });
            localStorage.setItem('art_items', JSON.stringify(items));
            renderItems();
        }

        function renderItems() {
            const items = JSON.parse(localStorage.getItem('art_items') || '[]');
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                li.innerHTML = `
                    <div class="item-info">
                        <strong>[${item.brand || '기타'}] ${item.name || '재료'}</strong>
                        <div>${item.type || ''} ${item.capacity ? '| ' + item.capacity : ''}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span class="qty-count">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        <button class="btn-danger" onclick="deleteItem(${item.id})">삭제</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
