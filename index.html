<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Inventory</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --primary-blue: #2563eb;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f1f5f9;
            --pastel-blue: #3b82f6;
            --pastel-blue-dark: #2563eb;
            --table-header-bg: #e0f2fe;
            --table-header-text: #0369a1;

            /* 아이콘 파스텔 배경 색상 */
            --btn-edit-bg: #bae6fd; /* 파스텔 블루 */
            --btn-edit-icon: #0284c7;
            --btn-delete-bg: #fecdd3; /* 파스텔 핑크 */
            --btn-delete-icon: #e11d48;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 540px;
            margin: 0 auto;
            padding: 20px 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            box-sizing: border-box;
        }

        /* 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: var(--pastel-blue-dark);
            letter-spacing: -0.5px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover { background: #e2e8f0; }

        /* View 영역 */
        .view { display: none; }
        .view.active { display: block; }

        /* 메인 카테고리 카드 */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: transform 0.1s, border-color 0.2s;
        }

        .category-card:active { transform: scale(0.98); }

        .category-card .category-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--pastel-blue);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 서브 헤더 - 정중앙 정렬 구조 */
        .sub-header {
            display: grid;
            grid-template-columns: 60px 1fr 60px;
            align-items: center;
            margin-bottom: 16px;
        }

        .sub-header h1 {
            text-align: center;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary-blue);
            cursor: pointer;
            padding: 0;
            text-align: left;
        }

        /* 검색 및 Add 버튼 영역 */
        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: #fff;
            font-size: 13px;
        }

        .btn-add-item {
            background: var(--pastel-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 테이블 레이아웃 */
        .inventory-table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        .inventory-table th {
            background-color: var(--table-header-bg);
            color: var(--table-header-text);
            padding: 10px 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inventory-table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--card-border);
            vertical-align: middle;
        }

        .inventory-table tr:last-child td {
            border-bottom: none;
        }

        .item-name-cell {
            font-weight: 600;
            color: var(--text-main);
        }

        .item-capacity-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* 둥근 원형 색상 썸네일 */
        .color-thumbnail-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid rgba(0,0,0,0.15);
            box-sizing: border-box;
            vertical-align: middle;
        }

        /* 컴팩트 수량 컨트롤 (▲/▼) */
        .qty-container {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--input-bg);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .qty-count {
            font-size: 12px;
            font-weight: 700;
            min-width: 16px;
            text-align: center;
        }

        .qty-arrows {
            display: flex;
            flex-direction: column;
        }

        .qty-arrow-btn {
            background: none;
            border: none;
            font-size: 7px;
            padding: 0 1px;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .qty-arrow-btn:hover { color: var(--primary-blue); }

        /* 파스텔톤 수정/지움 액션 버튼 스타일 (이미지 크기 확대 적용) */
        .actions-cell {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .btn-icon-square {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s;
            padding: 0;
        }

        .btn-icon-square:active { opacity: 0.7; }

        .btn-icon-edit {
            background-color: var(--btn-edit-bg);
            color: var(--btn-edit-icon);
        }

        .btn-icon-delete {
            background-color: var(--btn-delete-bg);
            color: var(--btn-delete-icon);
        }

        /* 내부 SVG 아이콘 크기 확대 (18px x 18px) */
        .btn-icon-square svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 360px;
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 17px;
            margin-bottom: 14px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .modal-btns button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-add-choice {
            background: #f1f5f9;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            width: 100%;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add-choice:hover { background: #e2e8f0; }

        .btn-save { background: var(--primary-blue); color: white; }
        .btn-cancel { background: #e2e8f0; color: var(--text-main); }

        .loading-text {
            display: none;
            text-align: center;
            color: var(--primary-blue);
            font-size: 13px;
            margin: 10px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- 메인 화면 -->
    <div id="mainView" class="view active">
        <header>
            <h1>Studio Inventory</h1>
            <button class="icon-btn" onclick="openSettings()">⚙️</button>
        </header>

        <div class="category-grid">
            <div class="category-card" onclick="openCategory('ACRYLIC')">
                <span class="category-name">ACRYLIC</span>
            </div>
            <div class="category-card" onclick="openCategory('OIL')">
                <span class="category-name">OIL</span>
            </div>
            <div class="category-card" onclick="openCategory('DRAWING')">
                <span class="category-name">DRAWING</span>
            </div>
            <div class="category-card" onclick="openCategory('MEDIUMS')">
                <span class="category-name">MEDIUMS</span>
            </div>
            <div class="category-card" onclick="openCategory('OTHERS')">
                <span class="category-name">OTHERS</span>
            </div>
        </div>
    </div>

    <!-- 카테고리 상세 목록 화면 -->
    <div id="detailView" class="view">
        <div class="sub-header">
            <button class="back-btn" onclick="showMainView()">← Back</button>
            <h1 id="categoryTitle">ACRYLIC</h1>
            <div></div>
        </div>

        <!-- 검색창 및 Add 버튼 바 -->
        <div class="action-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search items..." oninput="renderCategoryItems()">
            <button class="btn-add-item" onclick="openAddChoiceModal()">+ Add New Item</button>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
        <div id="loadingText" class="loading-text">✨ AI가 이미지를 분석하고 있습니다...</div>

        <!-- 아이템 데이터 표 (Table Layout) -->
        <div class="inventory-table-container">
            <table class="inventory-table">
                <thead>
                    <tr>
                        <th style="width: 35%;">ITEM NAME</th>
                        <th style="width: 20%;">BRAND</th>
                        <th style="width: 18%;">QTY</th>
                        <th style="width: 12%; text-align: center;">COLOR</th>
                        <th style="width: 15%; text-align: center;">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <!-- 스크립트로 항목 동적 생성 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 선택 팝업 모달 (사진 스캔 vs 직접 입력) -->
    <div id="addChoiceModal" class="modal">
        <div class="modal-content">
            <h3>+ 새 재료 추가 방법 선택</h3>
            <button class="btn-add-choice" onclick="selectAddOption('photo')">
                <span>📷</span>
                <span>사진 촬영 / AI 자동 스캔</span>
            </button>
            <button class="btn-add-choice" onclick="selectAddOption('manual')">
                <span>✍️</span>
                <span>직접 텍스트 입력하기</span>
            </button>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('addChoiceModal')">취소</button>
            </div>
        </div>
    </div>

    <!-- API 키 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>⚙️ API 키 설정</h3>
            <input type="password" id="apiKeyInput" placeholder="Google Gemini API Key">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('settingsModal')">취소</button>
                <button class="btn-save" onclick="saveApiKey()">저장</button>
            </div>
        </div>
    </div>

    <!-- 직접 등록 / 수정 모달 -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <h3 id="itemModalTitle">재료 등록</h3>
            <input type="hidden" id="editItemId">
            <input type="text" id="inputBrand" placeholder="브랜드 (예: 신한, 홀베인)">
            <input type="text" id="inputName" placeholder="재료/색상명 (예: 울트라마린 블루)">
            <input type="text" id="inputCapacity" placeholder="용량 (예: 50ml, 12색)">
            <input type="number" id="inputQty" placeholder="수량" value="1">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('itemModal')">취소</button>
                <button class="btn-save" onclick="saveManualItem()">저장</button>
            </div>
        </div>
    </div>

    <script>
        let currentCategory = '';

        function showMainView() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('mainView').classList.add('active');
        }

        function openCategory(cat) {
            currentCategory = cat;
            document.getElementById('categoryTitle').innerText = cat;
            document.getElementById('searchInput').value = '';
            document.getElementById('mainView').classList.remove('active');
            document.getElementById('detailView').classList.add('active');
            renderCategoryItems();
        }

        function openAddChoiceModal() {
            document.getElementById('addChoiceModal').classList.add('active');
        }

        function selectAddOption(option) {
            closeModal('addChoiceModal');
            if (option === 'photo') {
                triggerCamera();
            } else if (option === 'manual') {
                openManualAddModal();
            }
        }

        /* --- 미술 재료 대표 색상 매칭 함수 --- */
        function getColorCode(name) {
            if (!name) return '#cbd5e1';
            const lower = name.toLowerCase();

            if (lower.includes('white') || lower.includes('화이트') || lower.includes('백색')) return '#ffffff';
            if (lower.includes('black') || lower.includes('블랙') || lower.includes('검정')) return '#0f172a';
            if (lower.includes('ultramarine') || lower.includes('울트라마린')) return '#1e40af';
            if (lower.includes('cobalt blue') || lower.includes('코발트 블루')) return '#2563eb';
            if (lower.includes('cerulean') || lower.includes('세룰리안')) return '#0284c7';
            if (lower.includes('phthalo blue') || lower.includes('프탈로 블루')) return '#0369a1';
            if (lower.includes('blue') || lower.includes('블루') || lower.includes('청')) return '#3b82f6';
            if (lower.includes('cadmium red') || lower.includes('카드뮴 레드')) return '#dc2626';
            if (lower.includes('vermilion') || lower.includes('버밀리언') || lower.includes('주홍')) return '#ea580c';
            if (lower.includes('crimson') || lower.includes('크림슨') || lower.includes('alizarin')) return '#991b1b';
            if (lower.includes('magenta') || lower.includes('마젠타')) return '#db2777';
            if (lower.includes('pink') || lower.includes('핑크')) return '#f472b6';
            if (lower.includes('red') || lower.includes('레드') || lower.includes('빨강')) return '#ef4444';
            if (lower.includes('lemon') || lower.includes('레몬')) return '#fef08a';
            if (lower.includes('cadmium yellow') || lower.includes('카드뮴 옐로우')) return '#eab308';
            if (lower.includes('yellow') || lower.includes('옐로우') || lower.includes('노랑')) return '#facc15';
            if (lower.includes('ochre') || lower.includes('오커') || lower.includes('황토')) return '#ca8a04';
            if (lower.includes('orange') || lower.includes('오렌지') || lower.includes('주황')) return '#f97316';
            if (lower.includes('viridian') || lower.includes('비리디안')) return '#047857';
            if (lower.includes('sap green') || lower.includes('새프 그린')) return '#15803d';
            if (lower.includes('phthalo green') || lower.includes('프탈로 그린')) return '#065f46';
            if (lower.includes('green') || lower.includes('그린') || lower.includes('초록')) return '#22c55e';
            if (lower.includes('violet') || lower.includes('바이올렛') || lower.includes('purple') || lower.includes('퍼플') || lower.includes('보라')) return '#7c3aed';
            if (lower.includes('burnt sienna') || lower.includes('번트 시엔나')) return '#9a3412';
            if (lower.includes('raw umber') || lower.includes('로 엄버') || lower.includes('burnt umber') || lower.includes('번트 엄버')) return '#78350f';
            if (lower.includes('brown') || lower.includes('브라운') || lower.includes('갈색')) return '#a16207';
            if (lower.includes('grey') || lower.includes('gray') || lower.includes('그레이') || lower.includes('회색')) return '#64748b';

            return '#cbd5e1';
        }

        /* --- 데이터 관리 --- */
        function getItems() {
            return JSON.parse(localStorage.getItem('art_inventory') || '[]');
        }

        function saveItems(items) {
            localStorage.setItem('art_inventory', JSON.stringify(items));
        }

        function renderCategoryItems() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            let items = getItems().filter(i => i.category === currentCategory);

            if (query) {
                items = items.filter(i => 
                    (i.name && i.name.toLowerCase().includes(query)) ||
                    (i.brand && i.brand.toLowerCase().includes(query))
                );
            }

            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">등록된 재료가 없습니다.</td></tr>';
                return;
            }

            items.forEach(item => {
                const tr = document.createElement('tr');

                // 원형 색상 썸네일
                let colorBoxHtml = '-';
                if (currentCategory === 'ACRYLIC' || currentCategory === 'OIL') {
                    const colorHex = getColorCode(item.name);
                    colorBoxHtml = `<span class="color-thumbnail-circle" style="background-color: ${colorHex};" title="${colorHex}"></span>`;
                }

                tr.innerHTML = `
                    <td class="item-name-cell">
                        ${item.name}
                        ${item.capacity ? `<div class="item-capacity-text">${item.capacity}</div>` : ''}
                    </td>
                    <td>${item.brand || '기타'}</td>
                    <td>
                        <div class="qty-container">
                            <span class="qty-count">${item.qty}</span>
                            <div class="qty-arrows">
                                <button class="qty-arrow-btn" onclick="changeQty(${item.id}, 1)">▲</button>
                                <button class="qty-arrow-btn" onclick="changeQty(${item.id}, -1)">▼</button>
                            </div>
                        </div>
                    </td>
                    <td style="text-align: center;">${colorBoxHtml}</td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn-icon-square btn-icon-edit" onclick="openEditModal(${item.id})" title="수정">
                                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                            </button>
                            <button class="btn-icon-square btn-icon-delete" onclick="deleteItem(${item.id})" title="삭제">
                                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeQty(id, delta) {
            let items = getItems();
            items = items.map(i => {
                if (i.id === id) i.qty = Math.max(0, i.qty + delta);
                return i;
            });
            saveItems(items);
            renderCategoryItems();
        }

        function deleteItem(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            let items = getItems().filter(i => i.id !== id);
            saveItems(items);
            renderCategoryItems();
        }

        /* --- 모달 관련 --- */
        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API 키가 저장되었습니다.');
                closeModal('settingsModal');
            } else {
                alert('키를 입력해주세요.');
            }
        }

        function openManualAddModal() {
            document.getElementById('itemModalTitle').innerText = '재료 수동 등록';
            document.getElementById('editItemId').value = '';
            document.getElementById('inputBrand').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputCapacity').value = '';
            document.getElementById('inputQty').value = 1;
            document.getElementById('itemModal').classList.add('active');
        }

        function openEditModal(id) {
            const item = getItems().find(i => i.id === id);
            if (!item) return;
            document.getElementById('itemModalTitle').innerText = '재료 정보 수정';
            document.getElementById('editItemId').value = item.id;
            document.getElementById('inputBrand').value = item.brand || '';
            document.getElementById('inputName').value = item.name || '';
            document.getElementById('inputCapacity').value = item.capacity || '';
            document.getElementById('inputQty').value = item.qty || 1;
            document.getElementById('itemModal').classList.add('active');
        }

        function saveManualItem() {
            const id = document.getElementById('editItemId').value;
            const brand = document.getElementById('inputBrand').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const capacity = document.getElementById('inputCapacity').value.trim();
            const qty = parseInt(document.getElementById('inputQty').value) || 1;

            if (!name) {
                alert('재료 이름을 입력해주세요.');
                return;
            }

            let items = getItems();

            if (id) {
                items = items.map(i => {
                    if (i.id == id) {
                        return { ...i, brand, name, capacity, qty };
                    }
                    return i;
                });
            } else {
                items.push({
                    id: Date.now(),
                    category: currentCategory,
                    brand,
                    name,
                    capacity,
                    qty
                });
            }

            saveItems(items);
            closeModal('itemModal');
            renderCategoryItems();
        }

        /* --- AI 스캔 및 이미지 처리 --- */
        function triggerCamera() {
            const key = localStorage.getItem('gemini_api_key');
            if (!key) {
                alert('우측 상단 ⚙️ 설정에서 API 키를 먼저 입력해주세요.');
                openSettings();
                return;
            }
            document.getElementById('cameraInput').click();
        }

        document.getElementById('cameraInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            document.getElementById('loadingText').style.display = 'block';

            try {
                const base64 = await convertBase64(file);
                const aiResult = await analyzeImage(base64, apiKey);
                
                if (aiResult) {
                    let items = getItems();
                    items.push({
                        id: Date.now(),
                        category: currentCategory,
                        brand: aiResult.brand || '기타',
                        name: aiResult.name || '알 수 없는 재료',
                        capacity: aiResult.capacity || '',
                        qty: 1
                    });
                    saveItems(items);
                    renderCategoryItems();
                }
            } catch (err) {
                alert('분석 실패: ' + err.message);
                console.error(err);
            } finally {
                document.getElementById('loadingText').style.display = 'none';
                e.target.value = '';
            }
        });

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = err => reject(err);
            });
        }

        async function analyzeImage(base64Data, apiKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
            const prompt = "Analyze this art material image. Output ONLY JSON with keys: brand, name, capacity. Translate brand and name into Korean if possible.";

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                    ]
                }],
                generationConfig: {
                    response_mime_type: "application/json"
                }
            };

            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || 'API 통신 오류');
            }

            const data = await res.json();
            let text = data.candidates[0].content.parts[0].text;
            
            text = text.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(text);
        }
    </script>
